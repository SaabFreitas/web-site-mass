  if (fighting){ checkHits(); updateProjectiles(); updateDomain(); updateSuperAnim(); checkPropHits(); }
  updateItems();

  if (game.state === 'intro'){
    game.t++;
    const E = game.entrance ? 95 : 0; // com entrada, o anúncio do round vem depois
    if (game.entrance && game.t <= 92) game.f.forEach(f => runEntrance(f, game.t));
    if (game.entrance) updateProjectiles();
    if (game.t === 1 + E){ const final = a.wins === WINS_NEEDED - 1 && b.wins === WINS_NEEDED - 1; banner(final ? 'ROUND FINAL' : `ROUND ${game.round}`, null, '#b07cff', 75); SFX.boom(); say(final ? 'Round final' : `Round ${game.round}`); }
    if (game.t === 80 + E){ banner('LUTEM!', null, '#ff3448', 45); SFX.hitH(); say('Lutem!'); }
    if (game.t >= 110 + E) game.state = 'fight';
  } else if (game.state === 'fight'){
    if (game.bossFight){ const k = b.hp/b.maxHp, n = (game.screenCracks || []).length; if ((n === 0 && k < .66) || (n === 1 && k < .33) || (n === 2 && k < .1)){ addScreenCrack(); addText('A realidade está rachando...', W/2, 200, '#e0b8ff', 26); } }
    if (++game.timerFrames % 60 === 0) game.timer--;
    if (a.hp <= 0 || b.hp <= 0) endRound(false);
    else if (game.timer <= 0) endRound(true);
  } else if (game.state === 'finishhim'){
    game.t++;
    if (game.t > FINISH_TIME && game.fh){ const { w, l } = game.fh; l.state = 'launched'; l.finishPending = false; l.vy = -3; l.y = GROUND - 1; koFromFinish(w, 'TEMPO ESGOTADO'); }
  } else if (game.state === 'ko'){
    game.t++;
    const w = game.roundWinner;
    if (game.t === 110){
      if (w){ if (w.onGround){ w.state = 'victory'; w.move = null; } banner(`${w.c.name} vence!`, w.hp >= w.maxHp ? 'PERFEITO!' : null, w.c.colors.main, 90); say(`${w.c.name} vence`); }
      else banner('EMPATE', 'Ninguém pontua neste round', '#ffffff', 90);
    }
    if (w && game.t > 110 && w.onGround && w.state !== 'victory'){ w.state = 'victory'; w.move = null; }
    if (game.t >= 220){
      if (a.wins >= WINS_NEEDED || b.wins >= WINS_NEEDED){ game.state = 'matchover'; game.t = 0; Music.mode = 'menu'; }
      else { game.round++; startRound(); }
    }
  }
}

/* ===================== D6. RENDERIZAÇÃO ===================== */
function applyCam(sx = 0, sy = 0){ const c = game.cam; ctx.translate(W/2 + sx, H/2 + sy); ctx.scale(c.z, c.z); ctx.translate(-c.x, -c.y); }
/* Ordem: fundo e efeitos de trás → objetos e lutadores (com contorno grosso)
   → efeitos da frente → textos, HUD e menus. Tudo em HD direto na tela. */
function render(){
  ctx = mainCtx; ctx.setTransform(RS, 0, 0, RS, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.imageSmoothingEnabled = true;
  let sx = 0, sy = 0;
  if (game.shake > 0){ sx = rand(-1,1)*game.shake; sy = rand(-1,1)*game.shake*.6; game.shake *= .88; if (game.shake < .5) game.shake = 0; }
  const inMenu = game.state === 'menu' || game.state === 'select' || ((game.state === 'controls' || game.state === 'movelist') && game.returnTo === 'menu');
  const order = [...game.f].sort((x, y) => (x.state === 'attack' || x.state === 'superAct') - (y.state === 'attack' || y.state === 'superAct'));
  ctx.fillStyle = '#05030a'; ctx.fillRect(0, 0, W, H);
  if (game.state === 'cutscene'){ drawCutscene(); drawTouch(); return; }
  if (game.state === 'storySelect'){ drawStorySelect(); drawTouch(); return; }
  if (game.state === 'storyFail'){ drawStoryFail(); drawTouch(); return; }
  if (game.state === 'shatter'){ drawShatter(); drawTouch(); return; }
  ctx.save(); applyCam(sx, sy); drawBackground(); drawWearFx(); if (game.clash) drawClashBg();
  if (inMenu) drawParticles();
  else {
    if (game.domain) drawDomain(); drawSuperBg(); drawDecals(); order.forEach(drawShadow); drawItemFx(); order.forEach(drawFighterBack); drawDebris();
    drawProps(); drawItems(); order.forEach(drawFighterLit);
    order.forEach(drawFighterFront); drawProjectiles(); drawSuperFx(); drawFinisherFx(); drawSlashes(); drawParticles(); drawCranes(); drawImpacts(); drawClashFx();
  }
  ctx.restore();
  // Quadro de impacto (estilo anime): fundo chapado e silhuetas pretas por alguns frames
  if (!inMenu && game.impact){ ctx.fillStyle = game.impact.color; ctx.fillRect(0, 0, W, H); ctx.save(); applyCam(); game.f.forEach(f => drawFighter(f, f.x, f.y, { tint:'#000000' })); drawSlashes(); ctx.restore(); }
  if (!inMenu && !perf.low){ ctx.save(); applyCam(sx, sy); for (const q of bgFx.fog) glow(q.x, GROUND + 40, q.r, ['rgba(160,140,200,.16)','rgba(160,140,200,0)'], 50); ctx.restore(); } // neblina rasteira na frente
  drawVignette();
  if (game.sc && game.sc.fade > 0){ ctx.fillStyle = `rgba(0,0,0,${game.sc.fade})`; ctx.fillRect(0, 0, W, H); }
  if (inMenu){
    if (game.state === 'menu') drawMenu(); else if (game.state === 'select') drawSelect(); else if (game.state === 'controls') drawControls(); else drawMovelist();
    drawTouch(); drawFps(); return;
  }
  ctx.save(); applyCam(sx, sy); drawTexts(); ctx.restore();
  drawItemPrompts(sx, sy);
  drawSpeedLines();
  drawScreenCracks(); drawHUD(); drawCombo(); drawClashHud();
  if (game.state === 'finishhim' && game.fh) drawFinishPanel();
  drawBanner();
  if (game.flash > 0){ ctx.globalAlpha = game.flash/12; ctx.fillStyle = game.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (game.superFreeze) drawCutIn();
  if (game.state === 'paused'){ ctx.fillStyle = 'rgba(5,3,15,.72)'; ctx.fillRect(0, 0, W, H); bigText('PAUSA', W/2, 200, 90, '#ffffff', INK, 12); drawMenuList(PAUSE_ITEMS, game.pauseSel, W/2, 300); }
  if (game.state === 'controls') drawControls();
  if (game.state === 'movelist') drawMovelist();
  drawTouch(); drawFps();
  if (game.state === 'matchover' && game.story){
    const won = game.f[0].wins >= WINS_NEEDED;
    drawOverlay(won ? 'VITÓRIA!' : 'DERROTA...', [won ? 'O caminho segue pelo Mundo dos Mortos.' : 'A escuridão avança...', 'Enter para continuar'], won ? '#ffd23a' : '#ff3448');
  } else if (game.state === 'matchover'){
    const w = game.f.find(f => f.wins >= WINS_NEEDED), l = game.f.find(f => f !== w);
    const lines = [`Placar: ${w.wins} × ${l.wins}`];
    if (game.fatalityName) lines.unshift(`Finalização: ${game.fatalityName}`);
    if (game.mode === '1p') lines.push(isCpu(w.idx) ? 'A CPU venceu desta vez.' : 'Você venceu a CPU!');
    lines.push('Enter para revanche · Esc para o menu');
    drawOverlay(`${w.c.name} VENCE A PARTIDA`, lines, w.c.colors.main);
  }
}

// Vinheta cinematográfica (desenhada uma vez) e pulso vermelho com a vida baixa
const vigMemo = {};
function vignetteOf(color){
  if (!vigMemo[color]){
    const [c, g] = mkCanvas(W, H), gr = g.createRadialGradient(W/2, H/2, H*.35, W/2, H/2, W*.62);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, color); g.fillStyle = gr; g.fillRect(0, 0, W, H); vigMemo[color] = c;
  }
  return vigMemo[color];
}
function drawVignette(){
  ctx.drawImage(vignetteOf('rgba(10,8,30,.5)'), 0, 0);
  if (['fight','finishhim'].includes(game.state) && game.f.some(f => f.hp > 0 && f.hp < f.maxHp*.25)){
    ctx.globalAlpha = .45 + .3*Math.sin(game.frame*.15); ctx.drawImage(vignetteOf('rgba(255,20,40,.7)'), 0, 0); ctx.globalAlpha = 1;
  }
}
function drawFps(){
  if (!settings.fps) return;
  const txt = `${perf.fps} FPS${perf.low ? ' · leve' : ''}`;
  ctx.fillStyle = 'rgba(5,3,15,.7)'; ctx.fillRect(W/2 - 70, H - 30, 140, 24);
  uiText(txt, W/2, H - 18, 16, perf.fps >= 55 ? '#7dff9a' : perf.fps >= 40 ? '#ffd23a' : '#ff5a6a', 'center');
}
// Modo automático: se passar 3 s seguidos abaixo de 45 FPS numa luta, liga o modo leve
function autoQuality(){
  if (settings.gfx !== 'auto' || perf.low) return;
  const busy = ['intro','fight','ko','finishhim','fatality'].includes(game.state) && !document.hidden;
  perf.slowSecs = busy && perf.fps < 45 ? perf.slowSecs + 1 : 0;
  if (perf.slowSecs >= 3){ perf.low = true; setRes(); addText('Gráficos: modo leve', W/2, 160, '#9fd8b4', 22); }
}
/* Loop com passo fixo de 60 atualizações/s. Só redesenha quando a lógica
   avançou: em monitores de 120/144 Hz isso evita desenhar quadros repetidos.
   A tolerância de 1 ms evita pular quadros por oscilação do relógio a 60 Hz. */
let last = performance.now(), acc = 0, fpsFrames = 0, fpsT0 = last;
const STEP = 1000/60;
function loop(now){
  requestAnimationFrame(loop);
  acc += Math.min(100, now - last); last = now;
  let stepped = false;
  while (acc >= STEP - 1){ update(); pressed.clear(); mouse.press = {}; cpu.press = {}; touch.press = {}; acc -= STEP; stepped = true; }
  if (!stepped) return;
  render(); fpsFrames++;
  if (now - fpsT0 >= 1000){ perf.fps = Math.round(fpsFrames*1000/(now - fpsT0)); fpsFrames = 0; fpsT0 = now; autoQuality(); }
}
loadSettings(); applyGfx(); buildStages(); initBgFx(); toMenu();
requestAnimationFrame(loop);
</script>
