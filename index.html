<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cursed Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#141129; --fg:#ece8ff; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#141129; --fg:#ece8ff; } }
  :root[data-theme="dark"]{ --bg:#141129; --fg:#ece8ff; }
  html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
  body{ height:100%; margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-family:'Rajdhani', 'Segoe UI', sans-serif; }
  #wrap{ width:min(100vw, calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));
    aspect-ratio:16/9; max-width:100%; }
  canvas{ width:100%; height:100%; display:block; box-shadow:0 0 0 4px #0c0a18, 0 0 60px rgba(60,40,160,.35); outline:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="Cursed Clash, jogo de luta em estilo anime com modo história, para um ou dois jogadores"></canvas></div>
<script>
'use strict';
/* ==========================================================================
   CURSED CLASH v12 (HD) — jogo de luta 2D (HTML5 Canvas + JavaScript puro)
   Novidades da v12:
   • Modo história: Taiga ou Yukine descem ao Mundo dos Mortos (Meihua, Kage,
     Onimaru) até a Sombra no corpo do irmão; cenas com diálogos, final ruim
     com "tentar de novo" e a realidade se quebrando na vitória final.
   • Proporções realistas, Yukine agora é mulher, luz de cena (volume e luz
     de contorno) e câmera que aproxima a luta.
   • Cenário que se destrói aos poucos (rachaduras, buracos, incêndio,
     desabamentos e fendas no chão), 2 cenários novos e trilha sonora nova.
   • Estamina baixa deixa o lutador lento; controles de toque no celular e
     teclas de ataque mais robustas.
   Novidades da v3:
   • Arte em pixel art: o mundo é desenhado numa tela de 640×360 e ampliado 2×
     sem suavização; os sprites passam por um filtro que endurece as bordas e
     cria o contorno escuro de 1 pixel (estilo sprite de fliperama).
   • Lutadores novos: Taiga (fogo, punhos) e Yukine (vento, lâminas).
   • Objetos do cenário: chegue perto e aperte "Objeto" para arremessar.
   • Supers com animação própria que destrói/altera o cenário.
   • Modo 1 jogador contra a CPU (3 níveis).
   Novidades da v4:
   • Desempenho: sem shadowBlur, brilhos pré-desenhados, partículas em lote,
     marcas do cenário "carimbadas", filtro de pixel só onde há sprites,
     retratos em cache e redesenho só quando a lógica avança. Opções no menu:
     Gráficos (automático/alto/leve) e Mostrar FPS.
   • Lutadores redesenhados: membros afunilados com sombra, rostos de perfil,
     cabelos arrepiados; Yukine virou um samurai de haori azul com katanas.
   A. Configuração, controles (teclado/gamepad), áudio e música
   B. Personagens, golpes, poses e a classe Lutador
   C. Combate, estamina, cenário interativo, supers e finalizações
   D. Desenho (cenário, lutadores estilo anime, HUD, menus) e loop
   ========================================================================== */

/* ===================== A1. CONFIGURAÇÃO ===================== */
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');           // contexto "atual" (troca entre as camadas)
const mainCtx = ctx;                          // tela final 1280×720
const PIX = 1;                                // arte em resolução cheia (HD)
const W = 1280, H = 720, GROUND = 630, GRAV = 0.9, WALL_L = 70, WALL_R = 1210;
const ROUND_TIME = 99, WINS_NEEDED = 2, FINISH_TIME = 360; // 6 s para finalizar
const LEG1 = 50, LEG2 = 52, TORSO = 60, UARM = 31, FARM = 30, HEAD_R = 19; // proporção de anime (~6 cabeças de altura)
const ART_SCALE = .9, HEAD_SCALE = 1, HEAD_BOOST = .88; // proporções realistas (~7 cabeças de altura)
const PROP = { leg:1.2, torso:1.12, arm:1.17 }; // alonga pernas, tronco e braços do esqueleto base
const FONT_T = "'Bangers', 'Impact', sans-serif", FONT_U = "'Rajdhani', 'Segoe UI', sans-serif";
const INK = '#0c0a18';

/* ===================== A2. UTILIDADES ===================== */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b - a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const overlap = (a,b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hexToRgb(h){ const n = parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function toHex(r,g,b){ const c = v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0'); return '#'+c(r)+c(g)+c(b); }
// Cores derivadas são pedidas dezenas de vezes por quadro: guardamos o resultado
const colorMemo = new Map();
function memoColor(key, fn){ let v = colorMemo.get(key); if (v === undefined){ v = fn(); colorMemo.set(key, v); } return v; }
function shade(h,k){ return memoColor(h + '*' + k, () => { const [r,g,b] = hexToRgb(h); return toHex(r*k,g*k,b*k); }); }
function mix(a,b,t){ return memoColor(a + b + t, () => { const A = hexToRgb(a), B = hexToRgb(b); return toHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t); }); }
/* Brilhos radiais pré-desenhados: criar um gradiente por partícula/objeto a cada
   quadro era um dos maiores custos. Aqui o gradiente é desenhado uma vez numa
   tela pequena e depois só copiado (drawImage) no tamanho desejado. */
const glowMemo = new Map();
function glowSprite(stops){
  const key = stops.join('|'); let c = glowMemo.get(key);
  if (!c){
    c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    stops.forEach((col, i) => gr.addColorStop(i/(stops.length - 1), col));
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); glowMemo.set(key, c);
  }
  return c;
}
// Desenha um brilho centrado em (x,y) com raio rx (e ry para elipses)
function glow(x, y, rx, stops, ry = rx){ ctx.drawImage(glowSprite(stops), x - rx, y - ry, rx*2, ry*2); }
function moveBox(f,hb){ return { x: f.facing === 1 ? f.x + hb.x : f.x - hb.x - hb.w, y: f.y + hb.y, w: hb.w, h: hb.h }; }
/* ===================== A2b. CAMADAS =====================
   Desde a v5 tudo é desenhado em HD (1280×720) direto na tela; as camadas
   auxiliares (cenário recortável, marcas no chão) usam o mesmo tamanho. */
const LW = W/PIX, LH = H/PIX;
function mkCanvas(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); return [c, x];
}
function withCtx(c, fn){ const prev = ctx; ctx = c; try { fn(); } finally { ctx = prev; } }


/* ===================== A3. CONTROLES ERGONÔMICOS =====================
   Cada jogador usa a mão esquerda para mover e a direita para um bloco 2×2
   de ataques (como um controle arcade). Os blocos ficam separados por 2
   colunas de teclas, para as mãos dos dois jogadores não se encostarem.
   Tudo é remapeável na tela "Controles" e fica salvo no navegador. */
const ACTIONS = ['up','down','left','right','punch','kick','special','dash','item'];
const ACTION_LABEL = { up:'Pular', down:'Abaixar', left:'Esquerda', right:'Direita', punch:'Soco', kick:'Chute', special:'Especial', dash:'Dash / esquiva', item:'Objeto (arremessar)' };
const P1_MOVE = { up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD' };
const P2_MOVE = { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight' };
/* Esquemas prontos. No "Ergonômico" cada mão fica numa posição natural de
   digitação: a mão direita do J1 descansa em G H (T Y logo acima, B com o
   polegar/indicador) e a mão esquerda do J2 em K L (I O acima, "." abaixo), com
   a coluna J/U livre entre os dois. No "Mouse" o J2 anda com a mão esquerda em
   O K L Ç (como um WASD) e luta com o mouse na direita. */
const PRESETS = {
  ergo:{ name:'Ergonômico (padrão)', desc:'J1: WASD + G soco, H chute, T especial, Y dash, B objeto · J2: setas + L soco, K chute, O especial, I dash, "." objeto.',
    p:[ { ...P1_MOVE, punch:'KeyG', kick:'KeyH', special:'KeyT', dash:'KeyY', item:'KeyB' },
        { ...P2_MOVE, punch:'KeyL', kick:'KeyK', special:'KeyO', dash:'KeyI', item:'Period' } ] },
  mouse:{ name:'J2 com mouse', desc:'J2 anda em O K L Ç (mão esquerda) e luta no mouse: direito soco, esquerdo chute, rodinha especial, P dash.',
    p:[ { ...P1_MOVE, punch:'KeyG', kick:'KeyH', special:'KeyT', dash:'KeyY', item:'KeyB' },
        { up:'KeyO', left:'KeyK', down:'KeyL', right:'Semicolon', punch:'BracketLeft', kick:'Quote', special:'KeyI', dash:'KeyP', item:'Period' } ] },
  numpad:{ name:'Teclado completo (numpad)', desc:'J2 move nas setas e ataca no teclado numérico (objeto: Num 0).',
    p:[ { ...P1_MOVE, punch:'KeyG', kick:'KeyH', special:'KeyT', dash:'KeyY', item:'KeyB' },
        { ...P2_MOVE, punch:'Numpad4', kick:'Numpad5', special:'Numpad7', dash:'Numpad8', item:'Numpad0' } ] },
  notebook:{ name:'Antigo (blocos 2×2)', desc:'J1 ataca em G H / Y U (objeto: B), J2 em Ç L / P O (objeto: .).',
    p:[ { ...P1_MOVE, punch:'KeyG', kick:'KeyH', special:'KeyY', dash:'KeyU', item:'KeyB' },
        { ...P2_MOVE, punch:'Semicolon', kick:'KeyL', special:'KeyP', dash:'KeyO', item:'Period' } ] },
  classic:{ name:'Clássico (versão 1)', desc:'O esquema original: F G H e J K L (objeto: V e M).',
    p:[ { ...P1_MOVE, punch:'KeyF', kick:'KeyG', special:'KeyH', dash:'KeyT', item:'KeyV' },
        { ...P2_MOVE, punch:'KeyJ', kick:'KeyK', special:'KeyL', dash:'KeyI', item:'KeyM' } ] }
};
const PRESET_KEYS = ['ergo','mouse','numpad','notebook','classic'];
const settings = { preset:'ergo', bind:null, music:true, voice:true, cpu:1, gfx:'auto', fps:false };
/* Qualidade gráfica: perf.low reduz partículas e efeitos caros. No modo "auto"
   liga sozinho se o jogo ficar abaixo de ~45 FPS por alguns segundos. */
const perf = { low:false, fps:60, slowSecs:0 };
function clonePreset(k){ return PRESETS[k].p.map(b => ({ ...b })); }
function loadSettings(){
  try { const s = JSON.parse(localStorage.getItem('cursedclash.v6') || 'null'); if (s) Object.assign(settings, s); } catch(e){}
  if (!settings.bind || !settings.bind[0] || !settings.bind[1]) settings.bind = clonePreset(settings.preset in PRESETS ? settings.preset : 'ergo');
  const ref = clonePreset(settings.preset in PRESETS ? settings.preset : 'ergo'); // completa ações novas
  for (let p = 0; p < 2; p++) for (const a of ACTIONS) if (!settings.bind[p][a]) settings.bind[p][a] = ref[p][a];
}
function saveSettings(){ try { localStorage.setItem('cursedclash.v6', JSON.stringify(settings)); } catch(e){} }
function applyPreset(k){ settings.preset = k; settings.bind = clonePreset(k); saveSettings(); }
function assignKey(p, a, code){ // se a tecla já estava em uso, troca as duas de lugar
  const old = settings.bind[p][a];
  for (let q = 0; q < 2; q++) for (const b of ACTIONS) if (settings.bind[q][b] === code) settings.bind[q][b] = old;
  settings.bind[p][a] = code; settings.preset = 'custom'; saveSettings();
}
function isBound(code){ return settings.bind && settings.bind.some(b => Object.values(b).includes(code)); }
function keyLabel(code){ // rótulos pensados no teclado ABNT2
  if (!code) return '—';
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'Num ' + code.slice(6);
  const M = { ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→', Semicolon:'Ç', Quote:'~', BracketLeft:'´', BracketRight:'[',
    Backslash:']', Comma:',', Period:'.', Slash:';', IntlRo:'/', Minus:'-', Equal:'=', Space:'Espaço', ShiftLeft:'Shift', ShiftRight:'Shift D',
    ControlLeft:'Ctrl', ControlRight:'Ctrl D', AltLeft:'Alt', AltRight:'AltGr', Enter:'Enter', Tab:'Tab', Backquote:"'", CapsLock:'Caps' };
  return M[code] || code;
}

/* Teclado: keys = seguradas; pressed = apertadas neste passo lógico */
const keys = {}, pressed = new Set();
let remap = null; // { p, a } quando esperando uma tecla para remapear
/* Alguns teclados/navegadores mandam e.code vazio ou diferente: usamos a letra
   da tecla como reserva, para os botões de ataque sempre responderem. */
function keyCode(e){
  if (e.code && e.code !== 'Unidentified') return e.code;
  const k = (e.key || '').toLowerCase();
  if (/^[a-z]$/.test(k)) return 'Key' + k.toUpperCase();
  if (/^[0-9]$/.test(k)) return 'Digit' + k;
  return { arrowup:'ArrowUp', arrowdown:'ArrowDown', arrowleft:'ArrowLeft', arrowright:'ArrowRight', enter:'Enter', escape:'Escape', ' ':'Space', '.':'Period', ';':'Semicolon', 'ç':'Semicolon' }[k] || e.key;
}
window.addEventListener('keydown', e => {
  Object.defineProperty(e, 'code', { value:keyCode(e) });
  if (isBound(e.code) || ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','Slash','Quote'].includes(e.code)) e.preventDefault();
  initAudio();
  if (remap){ if (e.code !== 'Escape') assignKey(remap.p, remap.a, e.code); remap = null; SFX.select(); return; }
  if (!e.repeat) pressed.add(e.code);
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[keyCode(e)] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
canvas.addEventListener('pointerdown', () => { initAudio(); canvas.focus(); });
document.addEventListener('pointerdown', () => { try { window.focus(); canvas.focus(); } catch(e){} });
window.addEventListener('load', () => { try { window.focus(); canvas.focus(); } catch(e){} });
/* Controles de toque (celular/tablet): direcional à esquerda e botões de ataque
   à direita, desenhados por cima do jogo. Aparecem no primeiro toque na tela. */
const touch = { on:false, held:{}, press:{}, ptr:new Map() };
const TOUCH_BTNS = [
  { a:'left', x:92, y:590, r:44, t:'◀' }, { a:'right', x:236, y:590, r:44, t:'▶' }, { a:'up', x:164, y:518, r:44, t:'▲' }, { a:'down', x:164, y:662, r:40, t:'▼' },
  { a:'punch', x:1040, y:600, r:50, t:'SOCO' }, { a:'kick', x:1160, y:560, r:50, t:'CHUTE' }, { a:'special', x:1090, y:480, r:44, t:'ESPECIAL' },
  { a:'dash', x:1200, y:450, r:38, t:'DASH' }, { a:'item', x:950, y:660, r:34, t:'OBJETO' }, { a:'start', x:640, y:30, r:26, t:'II' }
];
function touchAction(e){
  const r = canvas.getBoundingClientRect(), x = (e.clientX - r.left)/r.width*W, y = (e.clientY - r.top)/r.height*H;
  let best = null, bd = 1e9;
  for (const b of TOUCH_BTNS){ const d = Math.hypot(x - b.x, y - b.y); if (d < b.r*1.35 && d < bd){ bd = d; best = b.a; } }
  return best;
}
function touchSet(id, a){
  const old = touch.ptr.get(id); if (old === a) return;
  if (old) touch.held[old] = [...touch.ptr].some(([k, v]) => k !== id && v === old);
  if (a){ touch.ptr.set(id, a); if (!touch.held[a]) touch.press[a] = true; touch.held[a] = true; } else touch.ptr.delete(id);
}
canvas.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; e.preventDefault(); touch.on = true; initAudio(); touchSet(e.pointerId, touchAction(e) || (['menu','select','matchover','storySelect','cutscene','storyFail','shatter'].includes(game.state) ? 'kick' : null)); });
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'touch' && touch.ptr.has(e.pointerId)){ const a = touchAction(e); if (a && a !== 'start') touchSet(e.pointerId, a); } });
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, e => { if (e.pointerType === 'touch') touchSet(e.pointerId, null); });
canvas.style.touchAction = 'none';
function drawTouch(){
  if (!touch.on) return;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const b of TOUCH_BTNS){
    const on = touch.held[b.a]; ctx.globalAlpha = on ? .55 : .28; ctx.fillStyle = on ? '#ffffff' : '#1a1433'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.globalAlpha = .7; ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.globalAlpha = .9; ctx.fillStyle = on ? '#1a1433' : '#ffffff'; ctx.font = `700 ${b.t.length > 2 ? 15 : 24}px ${FONT_U}`; ctx.fillText(b.t, b.x, b.y + 1);
  }
  ctx.restore();
}
/* Mouse do Jogador 2: botão direito = soco, esquerdo = chute, rodinha (clique) = especial.
   O menu de contexto é bloqueado para o clique direito funcionar no jogo. */
const MOUSE_BTN = { 0:'kick', 1:'special', 2:'punch' };
const mouse = { held:{}, press:{} };
canvas.addEventListener('mousedown', e => {
  const a = MOUSE_BTN[e.button]; if (!a) return;
  e.preventDefault(); initAudio(); canvas.focus();
  mouse.held[a] = true; mouse.press[a] = true;
});
window.addEventListener('mouseup', e => { const a = MOUSE_BTN[e.button]; if (a) mouse.held[a] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { mouse.held = {}; });

/* Gamepad (opcional): controle 1 = jogador 1, controle 2 = jogador 2.
   X/□ soco · A/✕ chute · Y/△ especial · B/○ dash · Start pausa */
const pads = [ { held:{}, press:{}, connected:false }, { held:{}, press:{}, connected:false } ];
function pollPads(){
  let list = [];
  try { list = (typeof navigator !== 'undefined' && navigator.getGamepads) ? Array.from(navigator.getGamepads()) : []; } catch(e){}
  let slot = 0;
  for (const gp of list){
    if (!gp || slot > 1) continue;
    const P = pads[slot], b = i => !!(gp.buttons[i] && gp.buttons[i].pressed), ax = gp.axes || [];
    const h = { up:b(12)||ax[1]<-.5, down:b(13)||ax[1]>.5, left:b(14)||ax[0]<-.5, right:b(15)||ax[0]>.5,
                punch:b(2), kick:b(0), special:b(3)||b(5), dash:b(1)||b(4), item:b(6)||b(7), start:b(9) };
    for (const k in h) P.press[k] = h[k] && !P.held[k];
    P.held = h; P.connected = true; slot++;
  }
  for (; slot < 2; slot++){ pads[slot].held = {}; pads[slot].press = {}; pads[slot].connected = false; }
}
/* No modo 1 jogador a CPU controla o jogador 2 por um "controle virtual" (cpu),
   e o humano pode usar tanto as teclas do J1 quanto as do J2. */
const cpu = { held:{}, press:{} };
const isCpu = p => game.mode === '1p' && p === 1;
const rawHeld = (p,a) => !!keys[settings.bind[p][a]] || !!pads[p].held[a] || (p === 1 && !!mouse.held[a]) || (p === 0 && !!touch.held[a]);
const rawTap  = (p,a) => pressed.has(settings.bind[p][a]) || !!pads[p].press[a] || (p === 1 && !!mouse.press[a]) || (p === 0 && !!touch.press[a]);
const held = (p,a) => isCpu(p) ? !!cpu.held[a] : game.mode === '1p' ? rawHeld(0,a) || rawHeld(1,a) : rawHeld(p,a);
const tapped = (p,a) => isCpu(p) ? !!cpu.press[a] : game.mode === '1p' ? rawTap(0,a) || rawTap(1,a) : rawTap(p,a);
const anyPad = k => pads.some(p => p.press[k]) || !!touch.press[k];
const navUp    = () => pressed.has('ArrowUp') || pressed.has('KeyW') || anyPad('up');
const navDown  = () => pressed.has('ArrowDown') || pressed.has('KeyS') || anyPad('down');
const navLeft  = () => pressed.has('ArrowLeft') || pressed.has('KeyA') || anyPad('left');
const navRight = () => pressed.has('ArrowRight') || pressed.has('KeyD') || anyPad('right');
const navOk    = () => pressed.has('Enter') || pressed.has('Space') || anyPad('kick') || anyPad('start');
const navBack  = () => pressed.has('Escape') || pressed.has('Backspace') || anyPad('dash');
const navPause = () => pressed.has('Escape') || anyPad('start');

/* ===================== A4. ÁUDIO =====================
   Tudo sintetizado: compressor na saída, reverb de convolução gerado,
   camadas de "thump" + ruído filtrado nos golpes e FM para metais/lâminas. */
let actx = null, master = null, revSend = null, musicBus = null, noiseBuf = null;
function initAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  master = actx.createGain(); master.gain.value = .75; master.connect(comp); comp.connect(actx.destination);
  const conv = actx.createConvolver(), len = actx.sampleRate*2.2, ir = actx.createBuffer(2, len, actx.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3); }
  conv.buffer = ir; revSend = actx.createGain(); revSend.gain.value = .35; revSend.connect(conv); conv.connect(master);
  musicBus = actx.createGain(); musicBus.gain.value = .3; musicBus.connect(master);

/* Narrador por voz sintetizada do navegador (pode ser desligado no menu) */
function say(text){
  if (!settings.voice || typeof speechSynthesis === 'undefined') return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'pt-BR'; u.pitch = .55; u.rate = .95;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('pt')); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}

function mvoice({ type='sawtooth', f=440, dur=.3, vol=.1, a=.01, cut=0, q=1, at=0, rev=0, det=0, vib=0 }){

  if (cut){ const fl = actx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(cut, t); fl.Q.value = q; o.connect(fl); fl.connect(g); } else o.connect(g);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, t + Math.max(a, dur*.55)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

}

const Music = {
  playing:false, step:0, next:0, timer:null, mode:'menu', cur:null,
  start(){ if (!actx || this.playing) return; this.playing = true; this.next = actx.currentTime + .1; this.timer = setInterval(() => this.tick(), 25); },
  stop(){ if (this.timer) clearInterval(this.timer); this.timer = null; this.playing = false; },
  tick(){
    const mode = this.mode === 'fight' && game.bossFight ? 'boss' : this.mode;
    if (mode !== this.cur){ this.cur = mode; this.step = 0; }
    const S = SONGS[mode] || SONGS.fight, dt = 60/(S ? S.bpm : 116)/4;
    while (this.next < actx.currentTime + .15){ this.play(mode, this.step, Math.max(0, this.next - actx.currentTime), dt); this.step++; this.next += dt; }
  },
  play(mode, s, at, dt){
    const M = musicBus;
    if (mode === 'finish'){ // só batidas de coração e um drone tenso
      const st = s % 16;
      if (st === 0 || st === 8){ osc({ f:62, f2:40, dur:.16, vol:.9, at, dest:M }); osc({ f:58, f2:38, dur:.16, vol:.7, at:at + .17, dest:M }); }
      if (s % 64 === 0) osc({ type:'sawtooth', f:mtof(38), dur:2.2, vol:.08, a:.5, at, dest:M });
      return;
    }

    const barDur = dt*16, rock = S.drums === 'rock', intro = loop === 0 && mode !== 'story' && bar < 2 && mode !== 'menu';
    // pad (acorde sustentado) e coro no chefe
    if (st === 0){ for (const n of tri) mvoice({ type:'sawtooth', f:N(n), dur:barDur*1.05, vol:.025, a:barDur*.3, cut:mode === 'story' ? 900 : 1300, at, rev:.5, det:(n % 3 - 1)*7 });
      if (S.choir) for (const n of tri) mvoice({ type:'triangle', f:N(n + 12), dur:barDur, vol:.03, a:barDur*.4, at, rev:.7, vib:.006 }); }
    // baixo
    if (mode === 'story'){ if (st === 0) mvoice({ type:'triangle', f:N(root), dur:barDur, vol:.12, a:.05, at, rev:.3 }); }
    else if (rock){ if (st % 2 === 0) mvoice({ type:'sawtooth', f:N(root + (st === 6 || st === 14 ? 12 : 0)), dur:dt*1.8, vol:.1, cut:620, q:4, at }); }
    else if ([0, 6, 10].includes(st)) mvoice({ type:'sawtooth', f:N(root), dur:dt*5, vol:.09, cut:500, q:2, at });
    // bateria
    if (rock){
      if ([0, 6, 8, 11].includes(st)) osc({ f:120, f2:40, dur:.22, vol:.8, at, dest:M });
      if (!intro && (st === 4 || st === 12)){ nz({ dur:.14, vol:.32, type:'bandpass', f:1900, q:.7, at, dest:M, rev:.2 }); osc({ f:200, f2:130, dur:.08, vol:.25, at, dest:M }); }
      if (!intro && st % 2 === 0) nz({ dur:st === 14 ? .12 : .035, vol:.07, type:'highpass', f:8000, at, dest:M });
      if (bar === nb - 1 && st >= 8 && (st % 2 === 0 || st > 12)) osc({ f:95 - (st - 8)*3, f2:48, dur:.35, vol:.6, at, dest:M, rev:.25 }); // virada de taiko
      if (st === 0 && bar === 0) nz({ dur:1.2, vol:.12, type:'highpass', f:5000, at, dest:M, rev:.4 }); // prato
    } else if (S.drums === 'taiko'){
      if (st === 0 || st === 10) osc({ f:st === 0 ? 85 : 110, f2:45, dur:.45, vol:st === 0 ? .8 : .45, at, dest:M, rev:.3 });
      if (bar === nb - 1 && [12, 13, 14].includes(st)) osc({ f:100, f2:50, dur:.3, vol:.5, at, dest:M, rev:.3 });
    }
    // arpejo de koto
    const arpOn = mode === 'story' ? st % 4 === 0 : mode === 'menu' ? st % 2 === 0 : loop % 2 === 1 || intro;
    if (arpOn && (mode !== 'fight' && mode !== 'boss' ? true : st % 2 === 0)){
      const k = Math.floor(st/(mode === 'story' ? 4 : 2)), n = tri[k % 3] + 12*(k % 6 >= 3 ? 1 : 0) + 12;

    if (!intro){
      const ev = S.mel[bar % S.mel.length].find(e => e[0] === st);
      if (ev){
        const [, n, len] = ev, d = dt*len*.95;
        if (S.flute || loop % 2 === 1) mvoice({ type:'triangle', f:N(n), dur:d + .15, vol:.075, a:.04, at, rev:.45, vib:.012 });
        else { mvoice({ type:'sawtooth', f:N(n), dur:d, vol:.05, a:.01, cut:2600, q:2, at, rev:.25, det:-7 }); mvoice({ type:'square', f:N(n), dur:d, vol:.025, a:.01, cut:2000, at, det:7 }); }
      }
    }
  }
};

/* Estado global (definido cedo porque a classe Lutador o consulta) */

const BTN = [['punch','P'],['kick','K'],['special','S'],['dash','D'],['item','I'],['up','U']];

      stamina:100, stamDelay:0, trans:0, dj:false, state:'idle', timer:0, move:null, anim:0, dirHist:[], btnHist:[], comboTaken:0, juggles:0,
      invuln:0, flash:0, airAttacked:false, holdBack:false, holdDown:false, crouchBlock:false, wasFull:this.energy >= 100,

      case 'idle': case 'walk': case 'crouch': this.neutral(inp); break;
      case 'jump':
        if (this.c.doubleJump && !this.dj && this.has('U') && this.vy > -9){ // pulo duplo (Meihua)
          this.use('U'); this.dj = true; this.vy = this.c.jumpV*.82; this.vx = inp.fwd ? this.facing*5.5 : inp.back ? -this.facing*5.5 : this.vx*.5;
          SFX.jump(); emit(this.x, this.y - 10, 12, { spread:4, vy:1, life:24, size:5, colors:this.c.colors.spark, type:'petal' }); addImpact(this.x, this.y - 6, 40, this.c.colors.glow, true);
          break;
        }
        if (this.has('K') && inp.down && !this.airAttacked){ this.use('K'); this.airAttacked = true; this.startMove('dive', 'K'); }
        else if (!this.airAttacked && (this.has('P') || this.has('K'))){ const b = this.has('P') ? 'P' : 'K'; this.use(b); this.airAttacked = true; this.startMove(b === 'P' ? 'airP' : 'airK', b); }
        break;
      case 'attack': if (this.move) this.updateAttack(inp); else this.state = this.onGround ? 'idle' : 'jump'; break;
      case 'dash':
        if (--this.timer <= 0) this.state = 'idle';
        else if (!this.dashBack && this.timer <= 8 && (this.has('P') || this.has('K'))){ this.state = 'idle'; this.neutral(inp); }
        break;
      case 'hit': case 'block': if (--this.timer <= 0){ this.state = this.onGround ? 'idle' : 'jump'; this.comboTaken = 0; } break;
      case 'down': if (--this.timer <= 0){ this.state = 'idle'; this.invuln = 20; this.comboTaken = 0; } break;
      case 'superCast': if (--this.timer <= 0) this.state = 'idle'; break;
    }

    // Física
    if (!this.onGround || this.vy < 0){
      this.vy += GRAV*(this.state === 'launched' ? .85 : 1); this.y += this.vy;
      if (this.y >= GROUND){ this.y = GROUND; this.vy = 0; this.land(); }
    }
    this.x += this.vx;
    const dashing = (this.state === 'attack' && this.move && this.move.dash && this.move.phase === 'active') || (this.state === 'dash' && this.timer > 6);
    if (this.onGround && this.state !== 'walk' && !dashing) this.vx *= .78;
    if (this.state === 'launched' && !this.wallHit && Math.abs(this.vx) > 5 && (this.x <= WALL_L + 2 || this.x >= WALL_R - 2)) wallSplat(this);
    this.x = clamp(this.x, WALL_L, WALL_R);
    if (this.state === 'launched') propCollision(this);

    // Estamina: recupera parado/andando, quase nada defendendo, nada atacando
    if (this.state === 'walk' && this.onGround && this.anim % 16 === 0) dust(this.x - this.facing*10, 2);
    if (this.stamDelay > 0) this.stamDelay--;
    else { const r = { idle:.55, crouch:.6, walk:.35, jump:.2, block:.12, down:.4 }[this.state]; if (r) this.stamina = Math.min(100, this.stamina + r*(this.trans > 0 ? 1.5 : 1)); }
    if (this.stamina > 50) this.tiredWarn = false;
    if (this.stamina < 25 && this.hp > 0 && game.frame % 24 === this.idx*12)
      emit(this.x + this.facing*6, this.y - 185, 1, { spread:1.5, vy:-1.5, life:30, size:4, colors:['#9fd4ff'], type:'drop' });

    if (game.state === 'fight' && this.hp > 0 && this.energy < 100) this.energy = Math.min(100, this.energy + .03);
    // Energia cheia: aura + aviso
    if (this.energy >= 100 && this.hp > 0){
      if (!this.wasFull){ this.wasFull = true; SFX.ready(); this.transform(); }
      if (game.frame % 2 === 0) emit(this.x + rand(-30,30), this.y - rand(10,170), 1, { spread:1, vy:-2.5, life:26, size:4, colors:this.c.colors.spark, type:'ember' });
    }
    if (this.c.shadow && this.hp > 0 && game.frame % 3 === this.idx) // fiapos de sombra saindo do corpo
      emit(this.x + rand(-26,26), this.y - rand(20,190), 1, { spread:.5, vx:-this.facing*.6, vy:-.8, life:34, size:7, colors:['#050507','#101016','#1c1c26'], type:'smoke' });
    if (this.c.key === 'oni' && this.hp > 0 && game.frame % 5 === this.idx) // fumaça escura saindo do corpo
      emit(this.x + rand(-30,30), this.y - rand(20,180), 1, { spread:.6, vy:-1.2, life:40, size:9, colors:['#2a0a3a','#3a1050','#1a0626'], type:'smoke' });
    if (this.fx.soot && game.frame % 14 === 0) emit(this.x, this.y - 60, 1, { spread:1, vy:-1, life:40, size:8, colors:['#444','#555'], type:'smoke' });

    this.lerpPose(this.targetPose(), this.state === 'attack' ? .55 : (this.state === 'down' || this.state === 'ko') ? .2 : .3);
    this.recordTrail();
    for (const b in this.buf) if (this.buf[b] > 0) this.buf[b]--;
    this.dispHp += (this.hp - this.dispHp)*.06;
  }
  /* Transformação ao encher a energia amaldiçoada: dura 10 s ou até usar o super.
     Dá +15% de dano, anda um pouco mais rápido e recupera estamina mais depressa. */
  transform(){
    if (!this.c.transName || game.state !== 'fight') return;
    this.trans = 600; const C = colorsOf(this);
    addText(this.c.transName + '!', this.x, this.y - 240, C.glow, 34);
    game.flash = 8; game.flashColor = C.glow; game.shake = Math.max(game.shake, 10);
    addImpact(this.x, this.y - 100, 150, C.glow, true); addImpact(this.x, this.y - 100, 90, '#ffffff', true);
    emit(this.x, this.y - 100, 36, { spread:12, vy:-2, life:34, size:6, colors:C.spark, type:this.c.key === 'mei' ? 'petal' : 'ember' });
    SFX.superStart(); say(this.c.transName.toLowerCase());
  }
  finisherInput(){
    if (this.has('S')){ this.use('S'); return 'amizade'; }
    if (this.has('P') && this.motion('qcf')){ this.use('P'); return 'suprema'; }
    if (this.has('K') && this.motion('dd')){ this.use('K'); return 'chibi'; }
    if (this.has('K') && this.motion('qcb')){ this.use('K'); return 'selo'; }
    return null;
  }
}

  if (perf.low) n = Math.ceil(n*.5);
  for (let i = 0; i < n; i++){
    const life = o.life*(.6 + Math.random()*.6);
    game.particles.push({ x, y, vx:(Math.random()-.5)*o.spread + (o.vx||0), vy:(Math.random()-.5)*o.spread + (o.vy||0),
      life, max:life, size:o.size*(.5 + Math.random()), color:pick(o.colors), type:o.type || 'spark', rot:Math.random()*6, vr:rand(-.3,.3) });
  }
  const cap = perf.low ? 300 : 650;
  if (game.particles.length > cap) game.particles.splice(0, game.particles.length - cap);
}

const projBox = p => ({ x:p.x - p.w/2, y:p.y, w:p.w, h:p.h });
function updateProjectiles(){
  const [f0, f1] = game.f;
  for (const p of game.projectiles){
    if (p.dead) continue;

    if (p.kind === 'fall') p.vy = 19;
    p.x += p.vx; p.y += p.vy; p.t++;
    if (p.life && p.t > p.life){ p.dead = true; continue; }
    const C = p.owner.c.colors;
    if (p.kind === 'fire')    emit(p.x - p.dir*20, p.y + p.h/2, 2, { spread:2, vx:-p.dir*2, vy:-1, life:20, size:6, colors:C.spark, type:'ember' });
    if (p.kind === 'inferno') emit(p.x + rand(-80,80), p.y + p.h - rand(0,60), 5, { spread:2, vy:-6, life:30, size:9, colors:C.spark, type:'ember' });
    if (p.kind === 'pillar')  emit(p.x + rand(-30,30), GROUND - rand(0,200), 4, { spread:2, vy:-5, life:24, size:8, colors:C.spark, type:'ember' });
    if (p.kind === 'quake'){
      if (p.t % 2 === 0) emit(p.x + rand(-20,20), GROUND - 4, 2, { spread:3, vy:-3, life:22, size:8, colors:['#3a2d55','#5c4a3a'], type:'smoke' });
      if (p.t % 4 === 0){ addDecal('crack', p.x); game.debris.push({ x:p.x, y:GROUND - 6, vx:rand(-2,2), vy:rand(-9,-5), rot:0, vr:.3, w:rand(5,10), h:rand(4,8), c:'#5c5470' }); }
      if (p.t % 6 === 0) game.shake = Math.max(game.shake, 3);
    }
    if (p.kind === 'oniball' && p.t % 2 === 0) emit(p.x - p.dir*24, p.y + p.h/2 + rand(-18,18), 1, { spread:1.5, vx:-p.dir*1.5, life:20, size:5, colors:C.spark, type:'ember' });
    if (p.kind === 'bolt' && p.t === p.delay + 1){ SFX.boom(); SFX.poof(); game.shake = Math.max(game.shake, 12); addDecal('scorch', p.x); emit(p.x, GROUND - 20, 22, { spread:6, vy:-4, life:34, size:14, colors:['#050507','#14141c','#24242e'], type:'smoke' }); }
    if (p.kind === 'disc' && p.t % 2 === 0) emit(p.x, p.y + p.h/2, 1, { spread:1, vx:-p.dir, life:18, size:8, colors:['#0a0a10','#1c1c26'], type:'smoke' });
    if (p.kind === 'blade' && p.t % 3 === 0) emit(p.x, p.y + p.h/2, 1, { spread:1, vx:-p.dir, life:14, size:2, colors:C.spark, type:'spark' });
    if (p.kind === 'fall' && p.y + p.h >= GROUND){ p.dead = true; addImpact(p.x, GROUND - 6, 30, C.glow); emit(p.x, GROUND - 4, 6, { spread:5, vy:-2, life:14, size:3, colors:C.spark, type:'spark' }); continue; }
    if (p.clash) for (const q of game.projectiles){
      if (q === p || q.dead || !q.clash || q.owner === p.owner) continue;
      if (overlap(projBox(p), projBox(q))){
        if (!p.isSuper) p.dead = true; if (!q.isSuper) q.dead = true;
        emit((p.x + q.x)/2, p.y + p.h/2, 22, { spread:10, life:20, size:4, colors:['#ffffff','#ffcf6a','#9fd4ff'], type:'spark' });
        addImpact((p.x + q.x)/2, p.y + p.h/2, 55, '#ffffff'); SFX.block();
      }
    }
    if (p.dead) continue;
    const tgt = p.owner === f0 ? f1 : f0;
    if (!p.visual && overlap(projBox(p), tgt.hurtbox())){
      if (tgt.state === 'attack' && tgt.move && tgt.move.counter && tgt.move.phase === 'active' && !p.isSuper && p.clash){
        p.owner = tgt; p.vx = -p.vx*1.3; p.dir *= -1; // Seiran reflete
        addText('REFLETIDO!', tgt.x, tgt.y - 225, tgt.c.colors.glow, 32);
        game.flash = 6; game.flashColor = '#dff2ff'; SFX.counter();
        tgt.move.f = tgt.move.startup + tgt.move.active;
      } else {
        const r = resolveHit(p.owner, tgt, p, { x:p.x, y:clamp(p.y + p.h/2, tgt.y - 160, tgt.y - 20) });
        if (r) p.dead = true;
      }
    }
    if (p.x < -250 || p.x > W + 250) p.dead = true;
  }

}

/* ===================== C3. ACERTOS, DEFESA E ESTAMINA ===================== */
function hitFx(a, pos, heavy, big){
  game.hitstop = big ? 12 : heavy ? 9 : 6;
  game.shake = Math.max(game.shake, big ? 16 : heavy ? 11 : 4);
  emit(pos.x, pos.y, heavy ? 28 : 14, { spread:heavy ? 14 : 8, life:18, size:4, colors:a.c.colors.spark, type:'spark' });
  addImpact(pos.x, pos.y, heavy ? 64 : 40, a.c.colors.spark[1]);
  if (heavy) addImpact(pos.x, pos.y, 90, a.c.colors.glow, true);
  if (heavy) speedLines(pos.x, pos.y, '#ffffff', big ? 24 : 12);
  if (big){ game.impact = { t:4, color:a.c.colors.main }; addText(pick(['撃!','破!','爆!','轟!']), pos.x, pos.y - 40, a.c.colors.glow, 64); }
  if (heavy) emit(pos.x, pos.y, 6, { spread:5, vy:-1, life:26, size:14, colors:['#ffffff', a.c.colors.spark[1]], type:'smoke' });
  heavy ? SFX.hitH() : SFX.hitL();
  if (heavy) game.camKick = Math.max(game.camKick || 0, big ? .09 : .045); // soco de câmera
}
function resolveHit(a, d, info, pos){
  // Durante o "ACABE COM ELE", qualquer golpe comum encerra com um nocaute simples
  if (game.state === 'finishhim'){
    if (d.state !== 'dazed' || !game.fh || a !== game.fh.w) return false;
    d.state = 'launched'; d.vy = -11; d.vx = (Math.sign(d.x - a.x) || a.facing)*8; d.y = GROUND - 1; d.flash = 8;
    hitFx(a, pos, true, true); koFromFinish(a, 'NOCAUTE!'); return 'hit';
  }
  if (game.state !== 'fight') return false;
  if (d.invuln > 0 || ['down','ko','dazed','cinematic'].includes(d.state)) return false;
  if (d.state === 'launched' && d.juggles >= 3) return false;
  if (info.grab && (!d.onGround || d.state === 'launched')) return false;
  let dir = Math.sign(d.x - a.x) || a.facing;

  if (d.state === 'attack' && d.move && d.move.counter && d.move.phase === 'active' && !info.isProj && !info.unblockable){ doCounter(d, a); return 'countered'; }
  // Soco Blindado (Onimaru): aguenta UM golpe durante a carga, levando só metade do dano
  if (d.state === 'attack' && d.move && d.move.armor && d.move.phase === 'startup' && !d.move.armored && !info.grab && !info.isSuper){
    d.move.armored = true; d.hp = Math.max(1, d.hp - info.dmg*.5); d.flash = 6; d.energy = Math.min(100, d.energy + 4);
    addText('ARMADURA!', d.x, d.y - 235, '#e6c2ff', 30); SFX.guardBreak(); game.hitstop = 8;
    addImpact(pos.x, pos.y, 80, d.c.colors.glow, true); emit(pos.x, pos.y, 14, { spread:8, life:16, size:4, colors:['#ffffff','#c9ccd8',d.c.colors.glow], type:'spark' });
    return 'block';
  }

  const canBlock = d.holdBack && d.onGround && ['idle','walk','crouch','block'].includes(d.state) && !info.unblockable &&
                   (!info.low || d.holdDown) && (!info.overhead || !d.holdDown);
  if (canBlock){
    d.stamina -= info.dmg*1.3 + 3; d.stamDelay = 30;
    d.move = null; d.crouchBlock = d.holdDown;
    if (d.stamina <= 0){ // defender demais esgota a guarda
      d.stamina = 0; d.state = 'hit'; d.timer = 45; d.crouchBlock = false;
      addText('GUARDA QUEBRADA!', d.x, d.y - 220, '#ffd23a', 32); SFX.guardBreak();
      game.hitstop = 10; addImpact(pos.x, pos.y, 90, '#ffd23a', true); speedLines(pos.x, pos.y);
      return 'block';
    }
    d.state = 'block'; d.timer = Math.max(10, (info.stun || 18) - 4);
    const chip = info.dmg*(info.chip ?? .12);
    d.hp = d.hp > 1 ? Math.max(1, d.hp - chip) : d.hp;
    d.vx = dir*(info.push + 2);
    d.energy = Math.min(100, d.energy + 3); a.energy = Math.min(100, a.energy + 2);
    emit(pos.x, pos.y, 10, { spread:7, life:14, size:3, colors:['#ffffff','#bfe0ff','#8fb8ff'], type:'spark' });

  const wasAir = !d.onGround || d.state === 'launched';

  if (a.trans > 0) dmg *= 1.15; // transformado: +15% de dano

  if (info.special && game.state === 'fight' && d.hp > 0){
    const wall = d.x <= WALL_L + 60 ? -1 : d.x >= WALL_R - 60 ? 1 : 0;
    if (wall && (Math.sign(d.x - a.x) || wall) === wall) startStageChange(a, d, wall);

}
function doCounter(d, a){
  a.move = null; a.state = 'hit'; a.timer = 20;
  d.move = { name:'counterSlash', pose:'slash', startup:0, active:0, recovery:22, f:0, phase:'recovery' };
  d.state = 'attack'; d.invuln = 12;
  const pos = { x:(a.x + d.x)/2, y:a.y - 110 };
  addSlash(pos.x, pos.y, .6, 230, d.c.colors.glow, 18); addSlash(pos.x, pos.y, -.9, 200, d.c.colors.glow, 12);
  addText('CONTRA-ATAQUE!', d.x, d.y - 225, d.c.colors.glow, 34);
  game.flash = 10; game.flashColor = '#dff2ff'; SFX.counter();
  resolveHit(d, a, { dmg:14, push:6, knockdown:true, unblockable:true, launch:-11, heavy:true, big:true }, pos);
}
function checkHits(){
  const [a, b] = game.f;
  const test = (x, y) => {
    const m = x.move;
    if (!m || !m.hit || m.phase !== 'active' || m.hitDone) return null;
    const hb = moveBox(x, m.hit), hu = y.hurtbox();
    if (!overlap(hb, hu)) return null;
    const ix = Math.max(hb.x, hu.x), iy = Math.max(hb.y, hu.y);
    return { m, pos:{ x:(ix + Math.min(hb.x + hb.w, hu.x + hu.w))/2, y:(iy + Math.min(hb.y + hb.h, hu.y + hu.h))/2 } };
  };
  const h1 = test(a, b), h2 = test(b, a);
  for (const [atk, def, h] of [[a,b,h1],[b,a,h2]]){
    if (!h) continue;
    h.m.hitDone = true;
    const m = h.m, last = m.multi && m.f + m.multi > m.startup + m.active; // último chute da sequência derruba
    const r = resolveHit(atk, def, last ? { ...m, knockdown:true, launch:m.finalLaunch || -9, big:true } : m, h.pos);
    if (r === 'hit' || r === 'block'){ h.m.connected = true; if (h.m.hist) h.m.hist.hit = true; }

}
function pushApart(a, b){
  if ([a,b].some(f => ['down','ko','cinematic'].includes(f.state))) return;
  if ([a,b].some(f => f.move && f.move.pass && f.move.phase !== 'recovery')) return; // atravessando o oponente
  if (Math.abs(a.y - b.y) > 120) return;
  const dx = b.x - a.x, ov = 56 - Math.abs(dx);
  if (ov <= 0) return;
  const s = Math.sign(dx) || (a.idx === 0 ? 1 : -1);
  a.x = clamp(a.x - s*ov/2, WALL_L, WALL_R); b.x = clamp(b.x + s*ov/2, WALL_L, WALL_R);
  if (Math.abs(b.x - a.x) < 56){ if (a.x <= WALL_L || a.x >= WALL_R) b.x = a.x + s*56; else a.x = b.x - s*56; }
}

/* ===================== C4. CENÁRIO INTERATIVO =====================
   Paredes (pilares do portão) racham com impactos; pilhas de carteiras quebram;
   corvos voam com o barulho; janelas estouram com os supers; chão fica marcado. */
function initProps(){
  game.props = [ { x:180, w:100, h:74, hp:3, broken:false, shake:0 }, { x:1100, w:100, h:74, hp:3, broken:false, shake:0 } ];
  game.debris = []; clearDecals();

const propBox = p => ({ x:p.x - p.w/2, y:GROUND - p.h, w:p.w, h:p.h });
function breakProp(p, dir){
  p.broken = true; addWear(.015);
  const cols = ['#6b4a2f','#8a6340','#4a3220','#9a9aa8','#6f6f7c'];
  for (let i = 0; i < 16; i++) game.debris.push({ x:p.x + rand(-p.w/2, p.w/2), y:GROUND - rand(10, p.h), vx:dir*rand(2,9) + rand(-2,2), vy:rand(-11,-4),
    rot:0, vr:rand(-.35,.35), w:rand(10,34), h:rand(5,10), c:pick(cols) });
  emit(p.x, GROUND - 30, 16, { spread:6, vy:-2, life:36, size:14, colors:['#3a2d55','#4b3b6e','#5c4a3a'], type:'smoke' });

function propCollision(f){

    if (overlap(propBox(p), f.hurtbox())){
      breakProp(p, Math.sign(f.vx));

      f.vx *= .5; f.vy = Math.min(f.vy, -4);

}
function checkPropHits(){
  for (const f of game.f){
    const m = f.move; if (!m || !m.hit || m.phase !== 'active' || m.propHit) continue;
    const hb = moveBox(f, m.hit);
    for (const p of game.props){

      emit(hb.x + hb.w/2, hb.y + hb.h/2, 8, { spread:6, life:18, size:4, colors:['#8a6340','#c09060'], type:'spark' });
      if (p.hp <= 0) breakProp(p, f.facing);

/* ===================== C4b. OBJETOS ARREMESSÁVEIS =====================
   Ficam no chão da arena. Chegue perto e aperte "Objeto": o lutador pega e
   arremessa na hora (um uso só, o objeto se quebra). Cada um tem efeito próprio:
   cadeira derruba, tijolo é rápido, lixeira espalha lixo, extintor deixa tonto
   por mais tempo e o cone... fica preso na cabeça do oponente. */
const IS = 1.3; // escala de desenho dos objetos
const ITEM_TYPES = {
  cadeira: { name:'Cadeira',  h:40*IS, w:36*IS, dmg:12, speed:11, knockdown:true, launch:-8, spin:.22, colors:['#a8743f','#6b4526','#9a9aaa'] },
  tijolo:  { name:'Tijolo',   h:14*IS, w:26*IS, dmg:9,  speed:15, stun:24, spin:.45, colors:['#b8492c','#7e2e1c','#e0cdb0'] },
  lixeira: { name:'Lixeira',  h:38*IS, w:28*IS, dmg:10, speed:11, knockdown:true, launch:-7, spin:.3, colors:['#4f7a5e','#2f4a3a','#9fc0aa'], trash:true },
  extintor:{ name:'Extintor', h:36*IS, w:16*IS, dmg:8,  speed:13, stun:44, spin:.35, colors:['#d4232f','#8e1420','#2a2a33'], foam:true },
  cone:    { name:'Cone',     h:30*IS, w:26*IS, dmg:6,  speed:13, stun:26, spin:.3, colors:['#ff7a1a','#c4520c','#f4f4f4'], hat:true }
};
const ITEM_KEYS = Object.keys(ITEM_TYPES);
function makeItem(type, x, y, state = 'ground'){
  const T = ITEM_TYPES[type];
  return { type, T, x, y:y ?? GROUND - T.h/2, vx:0, vy:0, rot:0, vr:0, state, owner:null, burning:false, t:0, bob:Math.random()*6 };
}
function initItems(){
  const pool = [...ITEM_KEYS].sort(() => Math.random() - .5);
  game.items = [300, 640, 980].map((x, i) => makeItem(pool[i], x + rand(-30,30)));
  game.itemTimer = 0;
}
function dropItem(type, x){ const it = makeItem(type, clamp(x, WALL_L + 40, WALL_R - 40), -60, 'falling'); game.items.push(it); return it; }
function launchItem(f, it){
  const o = f.opp, T = it.T, g = .35;
  it.state = 'flying'; it.owner = f; it.x = f.x + f.facing*34; it.y = f.y - 175;
  it.vx = f.facing*T.speed; it.vr = f.facing*T.spin;
  // Mira balística: calcula a subida para chegar na altura do peito do oponente
  const dist = Math.max(60, Math.abs(o.x - it.x)), tt = dist/T.speed, ty = o.y - 105;
  it.vy = clamp((ty - it.y - .5*g*tt*tt)/tt, -11, 3);

}
const itemBox = it => ({ x:it.x - it.T.w/2, y:it.y - it.T.h/2, w:it.T.w, h:it.T.h });
function shatterItem(it, dir){
  it.dead = true;
  const cols = it.T.colors;
  for (let i = 0; i < 9; i++) game.debris.push({ x:it.x + rand(-10,10), y:it.y + rand(-10,10), vx:dir*rand(-3,5) + rand(-2,2), vy:rand(-9,-3), rot:0, vr:rand(-.4,.4), w:rand(6,16), h:rand(4,9), c:pick(cols) });
  if (it.T.foam){ emit(it.x, it.y, 34, { spread:9, vy:-1, life:55, size:22, colors:['#ffffff','#e8f2ff','#d8e6f6'], type:'smoke' }); SFX.poof(); }
  if (it.T.trash) emit(it.x, it.y, 16, { spread:8, vy:-3, life:70, size:7, colors:['#f2efe4','#cfc9b6','#9fc0aa'], type:'confetti' });
  if (it.burning) emit(it.x, it.y, 14, { spread:6, vy:-2, life:26, size:6, colors:['#fff3b0','#ffb02a','#ff4a1a'], type:'ember' });

function sliceItem(it){ // cortado ao meio pelo super da Yukine
  it.dead = true; const cols = it.T.colors;
  for (const s of [-1, 1]) game.debris.push({ x:it.x + s*6, y:it.y, vx:s*rand(2,4), vy:rand(-7,-4), rot:0, vr:s*.2, w:it.T.w*.9, h:it.T.h*.45, c:cols[0] });
  emit(it.x, it.y, 8, { spread:6, life:16, size:3, colors:['#ffffff','#cfeaff'], type:'spark' });
}
function updateItems(){
  const live = game.state === 'fight';
  for (const it of game.items){
    if (it.dead) continue;
    it.t++;
    if (it.state === 'held'){
      const f = it.owner;
      if (!f || !f.move || f.move.item !== it){ it.state = 'falling'; it.vy = -3; it.vx = rand(-2,2); it.owner = null; continue; } // largou ao apanhar
      const up = f.move.f >= 7, tx = up ? f.x - f.facing*4 : f.x + f.facing*38, ty = up ? f.y - 214 : GROUND - it.T.h/2 - 6;
      it.x += (tx - it.x)*.45; it.y += (ty - it.y)*.45; it.rot += (0 - it.rot)*.3;
      continue;
    }
    if (it.state === 'falling'){
      it.vy += .6; it.x += it.vx; it.y += it.vy; it.rot += it.vr;
      if (it.y >= GROUND - it.T.h/2){
        it.y = GROUND - it.T.h/2;
        if (Math.abs(it.vy) > 4){ it.vy *= -.3; it.vx *= .5; SFX.thud(); }
        else { it.vy = 0; it.vx = 0; it.rot = 0; it.vr = 0; it.state = 'ground'; it.burning = false; }
      }
      it.x = clamp(it.x, WALL_L, WALL_R);
      continue;
    }
    if (it.state === 'flying'){
      it.vy += .35; it.x += it.vx; it.y += it.vy; it.rot += it.vr;
      if (it.burning) emit(it.x, it.y, 2, { spread:2, vy:-1.5, life:22, size:7, colors:['#fff3b0','#ffb02a','#ff4a1a'], type:'ember' });

        p.dead = true; shatterItem(it, -Math.sign(it.vx)); addImpact(it.x, it.y, 50, '#ffffff'); break;
      }
      if (it.dead) continue;
      if (live && tgt && overlap(itemBox(it), tgt.hurtbox())){
        if (tgt.state === 'attack' && tgt.move && tgt.move.counter && tgt.move.phase === 'active'){ // Yukine rebate o objeto
          it.owner = tgt; it.vx = -it.vx*1.2; it.vy = -4; it.vr *= -1;
          addText('REBATIDO!', tgt.x, tgt.y - 225, tgt.c.colors.glow, 30); SFX.counter(); game.flash = 5; game.flashColor = '#dff2ff';
          tgt.move.f = tgt.move.startup + tgt.move.active; continue;
        }
        const T = it.T, info = { dmg:it.burning ? 7 : T.dmg, stun:T.stun || 20, push:5, knockdown:!!(T.knockdown || it.burning), launch:T.launch || -7, heavy:true, isProj:true, chip:.2 };
        const pos = { x:it.x, y:clamp(it.y, tgt.y - 170, tgt.y - 20) };
        const r = resolveHit(own, tgt, info, pos);
        if (r){
          if (r === 'hit' && T.hat && tgt.hp > 0){ tgt.fx.cone = 360; addText('QUE CHAPÉU!', tgt.x, tgt.y - 230, '#ff9a3a', 28); }
          if (r === 'hit' && T.foam) addText('ESPUMA!', tgt.x, tgt.y - 230, '#ffffff', 28);

        continue;

      if (it.y >= GROUND - it.T.h/2 || it.x < WALL_L - 20 || it.x > WALL_R + 20){ shatterItem(it, -Math.sign(it.vx)); addDecal('crack', clamp(it.x, WALL_L, WALL_R)); }

    if (avail < 2 && ++game.itemTimer > 420){

}
function drawItemShape(type){ // pixel art simples, centrado em (0,0)

function breakWindows(n){

/* ===================== C4d. SUPER CHOQUE =====================
   Os dois supers ao mesmo tempo: os lutadores vão para o centro e disparam
   raios que se chocam no meio. Vence quem apertar ESPECIAL mais vezes (teclado,
   clique da rodinha do mouse para o J2, ou controle). O vencedor faz uma
   animação própria e acerta o dano de um especial normal; em empate os dois
   levam um pouco. Os dois perdem 2 barras de energia (metade da barra). */
const CLASH_DMG = 12;                         // dano de um especial normal
const CLASH_CPU_RATE = [.07, .095, .12];      // chance por quadro da CPU apertar (~4, 6 e 7 vezes por segundo)
function startClash(a, b){
  game.superFreeze = null; endSuperAnim(); game.domain = null; game.projectiles = [];
  for (const f of [a, b]){
    const e = f.superPrev ?? f.energy; f.energy = Math.max(0, e - 50); f.superPrev = undefined;
    f.wasFull = f.energy >= 100; f.trans = 0; f.move = null; f.vx = f.vy = 0; f.invuln = 0; f.trail = [];
    f.state = 'cinematic'; f.cinePose = 'cast'; f.fx.alpha = 1; f.fx.hidden = false;
  }
  const left = a.x <= b.x ? a : b, right = left === a ? b : a;
  game.state = 'clash'; game.t = 0;
  game.clash = { L:left, R:right, x0L:left.x, x0R:right.x, y0L:left.y, y0R:right.y, p:.5, t:0, mash:[0, 0], pop:[0, 0] };
  game.flash = 10; game.flashColor = '#ffffff'; game.shake = 20; SFX.superStart(); SFX.boom();
  banner('SUPER CHOQUE!', 'Aperte ESPECIAL sem parar: quem apertar mais vence!', '#ffd23a', 110); say('Super choque! Aperte especial!');
}
function updateClash(){
  const K = game.clash, t = ++K.t, { L, R } = K, cx = W/2;
  if (t <= 20){ const k = 1 - Math.pow(1 - t/20, 3); // vão para posição e pousam
    L.x = K.x0L + (cx - 230 - K.x0L)*k; R.x = K.x0R + (cx + 230 - K.x0R)*k; L.y = K.y0L + (GROUND - K.y0L)*k; R.y = K.y0R + (GROUND - K.y0R)*k; }
  if (!K.win){ L.facing = 1; R.facing = -1; }
  if (t > 20 && t < 130){
    // cabo de guerra: botões apertados empurram o ponto do choque
    for (const [i, f] of [[0, L], [1, R]]){ // só o botão de ESPECIAL conta
      let n = tapped(f.idx, 'special') ? 1 : 0;
      if (isCpu(f.idx)) n = Math.random() < CLASH_CPU_RATE[cpuLevel()] ? 1 : 0;
      if (n){ K.mash[i]++; K.pop[i] = 6; }
    }
    for (let i = 0; i < 2; i++) if (K.pop[i] > 0) K.pop[i]--;
    const target = clamp(.5 + (K.mash[0] - K.mash[1])*.025, .15, .85); // o ponto do choque anda na direção de quem apertou menos
    K.p += (target - K.p)*.15 + Math.sin(t*.3)*.002;
    if (t % 3 === 0){ const x = cx - 230 + 60 + (460 - 120)*K.p; emit(x, GROUND - 145, 4, { spread:9, life:18, size:4, colors:['#ffffff', L.c.colors.glow, R.c.colors.glow], type:'spark' }); }
    if (t % 10 === 0){ game.shake = Math.max(game.shake, 8); SFX.hitL(); }
    if (t % 24 === 0) SFX.charge();
  }
  if (t === 130){ // explosão final
    const x = cx - 230 + 60 + 340*K.p, tie = K.mash[0] === K.mash[1], winner = tie ? null : K.mash[0] > K.mash[1] ? L : R, loser = winner === L ? R : L;
    game.flash = 14; game.flashColor = '#ffffff'; game.shake = 30; game.impact = { t:5, color:'#ffffff' }; SFX.ko(); SFX.glass();
    addImpact(x, GROUND - 145, 260, '#ffffff', true); addImpact(x, GROUND - 145, 160, L.c.colors.glow, true); addImpact(x, GROUND - 145, 200, R.c.colors.glow, true);
    emit(x, GROUND - 145, 60, { spread:16, life:40, size:6, colors:['#ffffff', L.c.colors.spark[1], R.c.colors.spark[1]], type:'spark' });
    speedLines(x, GROUND - 145, '#ffffff', 28); breakWindows(4);
    addText(tie ? 'EMPATE NO CHOQUE!' : `${winner.c.name} VENCEU O CHOQUE! (${Math.max(...K.mash)} × ${Math.min(...K.mash)})`, W/2, 200, '#ffd23a', 34);
    addText('-2 barras de energia para os dois', W/2, 245, '#ffffff', 24);
    if (tie){ // empate: os dois voam e levam um pouco
      for (const f of [L, R]){ f.hp = Math.max(1, f.hp - 6); f.state = 'launched'; f.vx = (f === L ? -1 : 1)*9; f.vy = -9; f.y = GROUND - 1; f.lastHeavy = true; }
      K.end = 175;
    } else { // o vencedor faz a animação dele (clashWin) e acerta o dano de um especial
      K.win = { w:winner, l:loser, t:0, D:{} }; loser.cinePose = 'hit'; winner.cinePose = 'cast';
      K.end = 130 + 95;
    }
  }
  if (K.win){ if (clashWin(K.win)) return; }
  if (t > 130){ // quem foi arremessado cai com a física normal
    for (const f of [L, R]) if (f.state === 'launched'){ f.vy += GRAV*.85; f.y += f.vy; f.x = clamp(f.x + f.vx, WALL_L, WALL_R); if (f.y >= GROUND){ f.y = GROUND; f.land(); } }
  }
  for (const f of [L, R]){ f.anim++; f.lerpPose(f.targetPose(), .3); f.dispHp += (f.hp - f.dispHp)*.06; }
  if (K.end && t >= K.end){ // fim: a luta continua com os dois protegidos por um instante
    for (const f of [L, R]){ if (['launched','down','cinematic'].includes(f.state)){ f.state = 'idle'; f.y = GROUND; } f.invuln = 20; f.vx = f.vy = 0; f.fx.alpha = 1; }
    game.clash = null; game.state = 'fight';
  }
}
/* Animação de vitória no super choque, uma por lutador. Acerta no quadro 30 com
   o dano de um especial normal. Devolve true se a luta acabou no golpe (K.O. ou
   "acabe com ele"), para o choque parar ali. */
function clashWin(Wn){
  const { w, l, D } = Wn, t = ++Wn.t, C = w.c.colors, dir = Math.sign(l.x - w.x) || 1;
  const hit = extra => {
    game.state = 'fight'; l.state = 'idle'; l.invuln = 0; l.move = null;
    resolveHit(w, l, { dmg:CLASH_DMG, push:6, knockdown:true, launch:-13, heavy:true, big:true, unblockable:true, ...extra }, { x:l.x, y:l.y - 110 });

      game.clash = null; return true;
    }
    game.state = 'clash'; return false;
  };
  switch (w.c.key){
    case 'kaen': // gêiseres de fogo sob o oponente e uma coluna final
      w.cinePose = t < 28 ? 'windup' : 'slam';
      if (t === 10 || t === 18 || t === 26){ (D.g = D.g || []).push({ x:l.x + rand(-30,30), t:0, h:rand(120,180) }); SFX.fire(); game.shake = 8; }
      if (t === 30){ D.col = { x:l.x, t:0 }; SFX.boom(); addDecal('scorch', l.x); if (hit()) return true; }
      break;
    case 'seiran': // atravessa o oponente e o corte em X aparece depois
      if (t === 1){ w.cinePose = 'counter'; D.x0 = w.x; }
      if (t === 14){ w.x = clamp(l.x + dir*120, WALL_L, WALL_R); w.facing = -dir; w.cinePose = 'slash'; addSlash((D.x0 + w.x)/2, GROUND - 110, 0, Math.abs(w.x - D.x0) + 80, C.glow, 12); SFX.teleport(); SFX.slash(); }
      if (t === 30){ addSlash(l.x, l.y - 110, .8, 360, '#ffffff', 18); addSlash(l.x, l.y - 110, -.8, 360, C.glow, 18); SFX.counter(); if (hit()) return true; }
      break;
    case 'oni': // salta alto e afunda o chão ao lado do oponente
      if (t === 1){ w.cinePose = 'jump'; D.x0 = w.x; }
      if (t <= 26){ const k = t/26; w.x = D.x0 + (l.x - dir*70 - D.x0)*k; w.y = GROUND - Math.sin(k*Math.PI)*260; }
      if (t === 26){ w.y = GROUND; w.cinePose = 'slam'; }
      if (t === 30){ oniQuake(w, l.x); game.shake = 26; if (hit({ launch:-16 })) return true; }
      break;
    case 'mei': // cambalhota por cima e chute de mergulho dourado
      if (t === 1){ w.cinePose = 'flip'; D.x0 = w.x; }
      if (t <= 28){ const k = t/28; w.x = D.x0 + (l.x - dir*40 - D.x0)*k; w.y = GROUND - Math.sin(k*Math.PI*.8)*240; w.pose.rot = -k*Math.PI*2; if (t % 2 === 0) emit(w.x, w.y - 60, 2, { spread:3, life:26, size:5, colors:C.spark, type:'petal' }); }
      if (t === 28){ w.cinePose = 'dive'; w.pose.rot = 0; }
      if (t === 30){ w.y = GROUND; D.wings = { x:l.x, y:l.y - 140, t:0 }; SFX.magic(); if (hit()) return true; }
      break;
    case 'rai': // afunda na própria sombra e uma mão das trevas agarra o oponente
      if (t === 1){ w.cinePose = 'counter'; D.pool = 0; }
      if (t < 12){ w.fx.alpha = 1 - t/12; D.pool = t/12; }
      if (t === 16){ D.hand = { x:l.x, t:0 }; SFX.poof(); }
      if (t === 30){ SFX.boom(); if (hit({ launch:-15 })) return true; }
      if (t === 50){ w.x = clamp(l.x - dir*110, WALL_L, WALL_R); w.facing = dir; }

  if (D.hand) D.hand.t++;
  return false;
}

/* ---- Cenário alterável: janelas em chamas e cortes no fundo ---- */
function igniteWindows(x0, x1, chance){

  });

// Ponto do fundo depois dos cortes (as partes de cima dos cortes escorregaram)
function bgPt(x, y){
  const list = game.bgCuts.slice(), S = game.superAnim;
  if (S && S.D.cut && !S.D.baked) list.push(S.D.cut);
  for (const c of list){
    const dx = Math.cos(c.a), dy = Math.sin(c.a);
    if ((x - c.x)*dy - (y - c.y)*dx > 0){ x += dx*c.s; y += dy*c.s; }

}
function drawSplitBg(src, cut, seam){
  const dx = Math.cos(cut.a), dy = Math.sin(cut.a), ux = dy, uy = -dx, L = 4000;
  const half = s => { ctx.beginPath(); ctx.moveTo(cut.x - dx*L, cut.y - dy*L); ctx.lineTo(cut.x + dx*L, cut.y + dy*L);
    ctx.lineTo(cut.x + dx*L + ux*L*s, cut.y + dy*L + uy*L*s); ctx.lineTo(cut.x - dx*L + ux*L*s, cut.y - dy*L + uy*L*s); ctx.closePath(); };
  ctx.save(); half(-1); ctx.clip(); ctx.drawImage(src, 0, 0, W, H); ctx.restore();
  ctx.save(); ctx.translate(dx*cut.s, dy*cut.s); half(1); ctx.clip(); ctx.drawImage(src, 0, 0, W, H); ctx.restore();
  if (seam){ ctx.strokeStyle = '#0a0714'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cut.x - dx*L, cut.y - dy*L); ctx.lineTo(cut.x + dx*L, cut.y + dy*L); ctx.stroke(); }
}
function bakeCut(cut){ // grava o corte na imagem do cenário (fica até o fim da partida)
  const [tmpC, tmpX] = mkCanvas(LW, LH); tmpX.drawImage(bgWorkC, 0, 0);
  bgWorkX.setTransform(1, 0, 0, 1, 0, 0); bgWorkX.fillStyle = '#05030a'; bgWorkX.fillRect(0, 0, LW, LH);
  bgWorkX.setTransform(1/PIX, 0, 0, 1/PIX, 0, 0);

function flameColumn(x, h, w){

    if (t % 12 === 0) emit((w.x + l.x)/2 + rand(-80,80), GROUND - 200, 1, { spread:1, vy:-1.2, life:80, size:10, colors:['#ff4f7a','#ff8fb0'], type:'heart' });
  }

/* ===================== C7. ATUALIZAÇÃO DE EFEITOS ===================== */
function updateFx(){
  for (const p of game.particles){
    p.x += p.vx; p.y += p.vy; p.life--; p.rot += p.vr;
    switch (p.type){
      case 'spark': p.vx *= .9; p.vy = p.vy*.9 + .25; break;
      case 'ember': p.vx *= .96; p.vy -= .05; break;
      case 'smoke': p.vx *= .92; p.vy *= .92; p.size *= 1.03; break;
      case 'drop': case 'glass': p.vy += .35; break;
      case 'fw': p.vx *= .97; p.vy = p.vy*.97 + .06; break;
      case 'confetti': p.vy = Math.min(p.vy + .1, 2.4); p.vx = Math.sin(p.life*.1)*1.2; break;
      case 'heart': p.vx = Math.sin(p.life*.08)*.6; break;
      case 'petal': p.vx *= .96; p.vy = Math.min(p.vy + .06, 1.4); break;
    }
  }
  game.particles = game.particles.filter(p => p.life > 0);
  for (const c of game.cranes){ c.x += c.vx + Math.sin(c.life*.05)*.6; c.y += c.vy; c.vy -= .005; c.flap += .35; c.life--; }
  game.cranes = game.cranes.filter(c => c.life > 0 && c.y > -60);
  for (const d of game.debris){
    d.vy += .6; d.x += d.vx; d.y += d.vy; d.rot += d.vr;
    if (d.y > GROUND - 3){ d.y = GROUND - 3; d.vy *= -.3; d.vx *= .7; d.vr *= .5; if (Math.abs(d.vy) < 1) d.vy = 0; }
  }
  if (game.debris.length > 140) game.debris.splice(0, game.debris.length - 140);
  for (const p of game.props) if (p.shake > 0) p.shake--;
  game.slashes.forEach(s => s.t++); game.slashes = game.slashes.filter(s => s.t < s.max);
  game.impacts.forEach(s => s.t++); game.impacts = game.impacts.filter(s => s.t < s.max);
  game.texts.forEach(s => { s.t++; s.y -= .6; }); game.texts = game.texts.filter(s => s.t < s.max);
  if (game.banner && ++game.banner.t > game.banner.max) game.banner = null;
  if (game.combo && --game.combo.t <= 0) game.combo = null;
  if (game.speed && ++game.speed.t > game.speed.max) game.speed = null;
  if (game.impact && --game.impact.t <= 0) game.impact = null;
  if (game.flash > 0) game.flash--;
}

let WINDOWS = [], flickerWins = [];
function tree(g, x, y, a, len, w, R){
  if (w < 1 || len < 8) return;
  const x2 = x + Math.cos(a)*len, y2 = y + Math.sin(a)*len;
  g.strokeStyle = '#07040d'; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
  tree(g, x2, y2, a - .35 - R()*.3, len*.72, w*.7, R); tree(g, x2, y2, a + .3 + R()*.3, len*.7, w*.7, R);
}
/* Estilo da referência: céu em faixas chapadas (sem degradê), poucas estrelas
   e formas com contorno de tinta grosso. */
function skyBands(g, cols, bottom = 540){
  const h = bottom/cols.length;
  cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, Math.floor(i*h), W, Math.ceil(h) + 1); });
  g.fillStyle = cols[cols.length - 1]; g.fillRect(0, bottom, W, H - bottom);
}
function groundBands(g, cols){
  const top = 537;
  cols.forEach((c, i) => { const y0 = top + Math.pow(i/cols.length, 1.3)*(H - top); g.fillStyle = c; g.fillRect(0, Math.floor(y0), W, H - Math.floor(y0)); });
  g.fillStyle = INK; g.fillRect(0, top - 2, W, 5);
}
function starDots(g, R, n, maxY){
  for (let i = 0; i < n; i++){ const x = R()*W, y = R()*maxY, s = R() < .15 ? 3 : 2; g.fillStyle = R() < .3 ? '#8e82d8' : '#5a4f9a'; g.fillRect(x, y, s, s); }
}
function inkDisc(g, x, y, r, fill, shadow){

    for (let k = 0; k < 3; k++){ const v = d[j+k]; d[j+k] = Math.min(255, Math.round(v/q)*q + (v > 140 ? 8 : 0)); } // faixas de cor
  }

    const i = y*w + x, e = Math.max(Math.abs(lum[i] - lum[i + 1]), Math.abs(lum[i] - lum[i + w]), Math.abs(lum[i] - lum[i - 1]), Math.abs(lum[i] - lum[i - w]));

      ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = '#d9b0ff'; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i < 3; i++){ let a = p.t*.3 + i*2.1, x = p.x + Math.cos(a)*r*.6, y = cy + Math.sin(a)*r*.6; ctx.moveTo(x, y);

/* Partículas: desenhadas em dois lotes (normal e aditivo) para não trocar o modo
   de mistura a cada uma; brasas/faíscas pequenas viram quadrados (pixel art). */
const NORMAL_PART = new Set(['smoke','confetti','heart','drop','petal']);
function drawParticle(p, a){
  ctx.globalAlpha = p.type === 'smoke' ? a*.5 : a;
  ctx.fillStyle = p.color;
  switch (p.type){
    case 'spark': case 'fw': ctx.strokeStyle = p.color; ctx.lineWidth = p.size*.7; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx*2.5, p.y - p.vy*2.5); ctx.stroke(); break;
    case 'confetti': { const w = p.size*Math.abs(Math.cos(p.rot)) + 1; ctx.fillRect(p.x - w/2, p.y - p.size/4, w, p.size/2); break; }
    case 'heart': ctx.save(); ctx.translate(p.x, p.y); const s = p.size/10; ctx.scale(s, s); ctx.beginPath(); ctx.moveTo(0, 4); ctx.bezierCurveTo(-10, -4, -5, -12, 0, -6); ctx.bezierCurveTo(5, -12, 10, -4, 0, 4); ctx.fill(); ctx.restore(); break;
    case 'petal': ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size*.45*Math.abs(Math.cos(p.rot)) + .6, p.rot, 0, 7); ctx.fill(); break;
    case 'drop': case 'glass': ctx.fillRect(p.x - p.size*.5, p.y - p.size, p.size, p.size*2); break;
    case 'smoke': ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); break;
    default: { const r = Math.max(1, p.size*a); ctx.fillRect(p.x - r, p.y - r, r*2, r*2); }
  }
}
function drawParticles(){
  ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'source-over';
  for (const p of game.particles) if (NORMAL_PART.has(p.type)) drawParticle(p, clamp(p.life/p.max, 0, 1));
  ctx.globalCompositeOperation = 'lighter';
  for (const p of game.particles) if (!NORMAL_PART.has(p.type)) drawParticle(p, clamp(p.life/p.max, 0, 1));
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawCranes(){
  for (const c of game.cranes){
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s); ctx.globalAlpha = Math.min(1, c.life/40);
    const w = Math.cos(c.flap)*12;
    ctx.fillStyle = '#f4f7ff'; ctx.strokeStyle = '#8fb8ff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-12, 2); ctx.lineTo(0, -3); ctx.lineTo(14, -8); ctx.lineTo(4, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#dfe8fb'; ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(2, -w - 4); ctx.lineTo(6, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}
function drawSlashes(){
  ctx.save(); ctx.lineCap = 'round';
  for (const s of game.slashes){ // corte chapado: contorno preto, cor do lutador e miolo branco
    const k = s.t/s.max, len = s.len*Math.min(1, k*3), dx = Math.cos(s.ang)*len/2, dy = Math.sin(s.ang)*len/2, w = s.w*(1 - k);
    ctx.globalAlpha = 1 - k*.7; ctx.beginPath(); ctx.moveTo(s.x - dx, s.y - dy); ctx.lineTo(s.x + dx, s.y + dy);
    ctx.strokeStyle = INK; ctx.lineWidth = w + 5; ctx.stroke();
    ctx.strokeStyle = s.color; ctx.lineWidth = w; ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = w*.35; ctx.stroke();
  }
  ctx.restore();
}
function drawImpacts(){
  ctx.save();
  for (const im of game.impacts){
    const k = im.t/im.max, r = im.size*(.4 + k*.8);
    ctx.globalAlpha = 1 - k;
    if (im.ring){ ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = im.color; ctx.lineWidth = 6*(1 - k) + 1; ctx.beginPath(); ctx.arc(im.x, im.y, im.size*(.3 + k*1.4), 0, 7); ctx.stroke(); continue; }
    ctx.globalCompositeOperation = 'source-over'; ctx.beginPath();
    for (let i = 0; i < 16; i++){ const a = i/16*Math.PI*2, rr = i % 2 ? r*.35 : r; ctx.lineTo(im.x + Math.cos(a)*rr, im.y + Math.sin(a)*rr); }
    ctx.closePath(); ctx.fillStyle = im.color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(im.x, im.y, r*.25, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ===================== D3. HUD ===================== */
function bigText(txt, x, y, size, fill, stroke = INK, lw = 8, align = 'center'){
  ctx.font = `${Math.round(size*.9)}px ${FONT_T}`; ctx.letterSpacing = '1.5px'; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'miter'; ctx.miterLimit = 2;
  ctx.strokeStyle = stroke; ctx.lineWidth = lw*.8; ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}
function uiText(txt, x, y, size = 18, color = '#ece8ff', align = 'left', weight = 700){
  ctx.font = `${weight} ${Math.round(size*1.05)}px ${FONT_U}`; ctx.letterSpacing = '0.5px'; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y);
}
function para(x, y, w, h, s){ ctx.beginPath(); ctx.moveTo(x + s, y); ctx.lineTo(x + w + s, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); }
function drawPortrait(f, x, y, right){
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, 36, 0, 7); ctx.fillStyle = '#1f1a3d'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = f.c.colors.main; ctx.stroke(); ctx.clip();
  const expr = f.hp <= 0 || f.state === 'hit' || f.state === 'launched' ? 'hurt' : f.state === 'attack' ? 'shout' : 'calm';
  ctx.drawImage(portraitSprite(f, expr, right), x - 40, y - 40, 80, 80);
  ctx.restore();
}
// O retrato é desenhado uma única vez por expressão e reaproveitado
const portraitMemo = new Map();
function portraitSprite(f, expr, right){
  const key = f.c.key + f.c.colors.main + f.c.colors.coat + expr + right + (f.trans > 0); let c = portraitMemo.get(key);

    const [pc, px] = mkCanvas(80, 80);
    withCtx(px, () => { drawPortraitFlares(f, right); ctx.translate(40 - (right ? -4 : 4), 52); ctx.scale(right ? -1.45 : 1.45, 1.45); drawHead(f, c => c, INK, expr, 0, true); });
    c = pc; portraitMemo.set(key, c);
  }
  return c;
}
function fillBar(x, y, w, h, s, ratio, style, right){
  ctx.save(); para(x, y, w, h, s); ctx.clip(); ctx.fillStyle = style;
  if (right) ctx.fillRect(x - 30, y, w*ratio + 30, h); else ctx.fillRect(x + w*(1 - ratio), y, w*ratio + 30, h);
  ctx.restore();
}

/* Close do Taiga: um punho enfaixado em chamas vem na direção da câmera e

function drawCutFist(k, C, left){

    ctx.lineTo(cx + Math.cos(a + .12)*r0, cy + Math.sin(a + .12)*r0); ctx.fill();

  ctx.translate(cx, cy); ctx.scale(sc*d, sc);

  ctx.fillStyle = sh; ctx.beginPath(); ctx.roundRect(-130, 10, 190, 64, 30); ctx.fill(); ctx.stroke(); // polegar
  ctx.strokeStyle = sh; ctx.lineWidth = 5; for (let i = 0; i < 5; i++){ ctx.beginPath(); ctx.moveTo(-110, 20 + i*14 - 60); ctx.lineTo(110, 34 + i*14 - 60); ctx.stroke(); }

/* Close do Kage: escuridão total; o capacete com a meia-lua surge devagar,

/* Close do Onimaru: o kanji 鬼 cai do alto como um carimbo, com olhos de

    for (let i = 0; i < 26; i++){ const y = 250 + R()*220, x = ((R()*W + t*(left ? 40 : -40)*(1 + R())) % (W + 400) + W + 400) % (W + 400) - 200; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 160, y); ctx.stroke(); }

/* Seleção: cada jogador move o seu cursor e confirma.
   J1: A/D + soco (ou Espaço) · J2: ←/→ + soco, Enter ou clique do mouse.
   Contra a CPU: ←/→ ou A/D, Enter confirma; a CPU sorteia outro lutador. */
function selInput(p){
  const B = settings.bind[p], pd = pads[p].press, P = c => pressed.has(c);
  if (game.mode === '1p') return { l:navLeft(), r:navRight(), ok:navOk() || P(B.punch) || P(settings.bind[1].punch) || !!mouse.press.kick || !!mouse.press.punch, back:pressed.has('Backspace') || P(B.kick) };
  return p === 0
    ? { l:P('KeyA') || !!pd.left, r:P('KeyD') || !!pd.right, ok:P(B.punch) || P('Space') || !!pd.punch || !!pd.kick, back:P(B.kick) }
    : { l:P('ArrowLeft') || !!pd.left, r:P('ArrowRight') || !!pd.right, ok:P(B.punch) || P('Enter') || P('NumpadEnter') || !!pd.punch || !!pd.kick || !!mouse.press.kick || !!mouse.press.punch, back:P(B.kick) || P('Backspace') };
}
function updateSelect(){
  const n = CHARS.length, human = game.mode === '1p' ? [0] : [0, 1];
  if (pressed.has('Escape') || (anyPad('dash') && !game.ready.some(Boolean))){ game.state = 'menu'; SFX.ui(); return; }
  for (const p of human){
    const I = selInput(p);
    if (I.back && game.ready[p]){ game.ready[p] = false; SFX.ui(); continue; }
    if (game.ready[p]) continue;
    if (I.l){ game.sel[p] = (game.sel[p] + n - 1) % n; SFX.ui(); }
    if (I.r){ game.sel[p] = (game.sel[p] + 1) % n; SFX.ui(); }
    if (I.ok){ game.ready[p] = true; SFX.select(); say(CHARS[game.sel[p]].name); }
  }
  if (game.mode === '1p'){
    if (navUp()){ settings.cpu = (settings.cpu + 1) % 3; saveSettings(); SFX.ui(); }
    if (navDown()){ settings.cpu = (settings.cpu + 2) % 3; saveSettings(); SFX.ui(); }
    if (game.ready[0]){ const others = CHARS.map((c, i) => i).filter(i => i !== game.sel[0]); game.sel[1] = pick(others); game.ready[1] = true; }
  }
  if (game.ready[0] && game.ready[1]){ if (++game.readyT > 25) startMatch(); } else game.readyT = 0;
}

/* ===================== D4b. CPU (MODO 1 JOGADOR) =====================
   A CPU "aperta botões" num controle virtual (cpu.held / cpu.press), então usa
   exatamente as mesmas regras do jogador: combos precisam acertar, especiais
   precisam do movimento (↓↘→), gasta estamina e energia. A cada decisão ela olha
   distância, estado do oponente, projéteis e objetos. A dificuldade muda o tempo
   de reação e as chances de defender, combar, usar objetos e anti-aéreos. */
const CPU_LEVELS = ['Fácil', 'Normal', 'Difícil'];
const AI_CFG = [
  { react:42, block:.07, combo:.1,  item:.12, proj:.08, anti:.04, special:.04, idle:.4, super:.25, dmg:.7 },
  { react:13, block:.5,  combo:.55, item:.55, proj:.35, anti:.4,  special:.22, idle:0, super:.5, dmg:1 },
  { react:6,  block:.8,  combo:.85, item:.7,  proj:.45, anti:.7,  special:.32, idle:0, super:.5, dmg:1 }
];
const AI = {
  q:[], cd:0, finDone:false,
  reset(){ this.q = []; this.cd = 0; this.finDone = false; cpu.held = {}; cpu.press = {}; },
  seq(steps){ this.q.push(...steps.map(s => ({ ...s }))); },
  motion(kind, fwd, back, btn){ // sequência de direções como um jogador faria
    if (kind === 'dd') return [{ hold:['down'], n:3 }, { hold:[], n:3 }, { hold:['down'], press:[btn], n:3 }];
    const d = kind === 'qcf' ? fwd : back;
    return [{ hold:['down'], n:3 }, { hold:['down', d], n:3 }, { hold:[d], press:[btn], n:3 }];
  },
  update(){
    cpu.press = {};
    const f = game.f[1], o = game.f[0];
    if (game.state !== 'fight' && game.state !== 'finishhim'){ cpu.held = {}; this.q = []; return; }
    const L = AI_CFG[cpuLevel()] || AI_CFG[1], fwd = o.x >= f.x ? 'right' : 'left', back = fwd === 'right' ? 'left' : 'right';
    if (this.q.length){ // executando uma sequência (combo, especial, pulo)
      const s = this.q[0]; cpu.held = {};
      for (const h of s.hold || []) cpu.held[h] = true;
      if (!s.done){ s.done = true; for (const b of s.press || []) cpu.press[b] = true; }
      if (--s.n <= 0) this.q.shift();
      return;
    }
    if (game.state === 'finishhim'){ // a CPU venceu: escolhe uma finalização
      cpu.held = {};
      if (game.fh && game.fh.w === f && !this.finDone && game.t > 50){
        this.finDone = true; const r = Math.random();
        if (r < .4) this.seq(this.motion('qcf', fwd, back, 'punch'));
        else if (r < .6) this.seq(this.motion('qcb', fwd, back, 'kick'));
        else if (r < .8) this.seq(this.motion('dd', fwd, back, 'kick'));
        else this.seq([{ press:['special'], n:2 }]);

      return;
    }
    const dist = Math.abs(o.x - f.x);
    const free = ['idle','walk','crouch','block'].includes(f.state) && f.onGround;
    // Ameaças: golpe começando, projétil vindo, objeto voando, super do oponente
    const oAtk = o.state === 'attack' && o.move && o.move.phase !== 'recovery' && o.move.hit && dist < 240;
    const proj = game.projectiles.find(p => p.owner === o && Math.sign(p.vx || 0) === Math.sign(f.x - p.x) && Math.abs(p.x - f.x) < 320);
    const flying = game.items.find(it => it.state === 'flying' && it.owner === o && Math.abs(it.x - f.x) < 280);
    const sup = game.superAnim && game.superAnim.owner === o;
    if (free && (oAtk || proj || flying || sup)){

    }
    if (this.cd > 0){ this.cd--; return; }
    cpu.held = {};
    if (!free || f.state === 'block'){ this.cd = 2; return; }
    const R = Math.random();
    if (L.idle && Math.random() < L.idle){ this.cd = L.react; return; } // no fácil a CPU às vezes só observa

    if (f.stamina < 22){ cpu.held[back] = true; this.cd = 24; return; } // cansada: recua

    if (o.state === 'down'){ cpu.held[dist < 160 ? back : fwd] = true; this.cd = 10; return; }
    // Objetos
    const it = f.nearItem();
    if (it && dist > 140 && Math.random() < L.item){ cpu.press.item = true; this.cd = L.react + 12; return; }
    if (!it && dist > 260 && Math.random() < L.item*.4){
      const g = game.items.filter(i => i.state === 'ground').sort((p, q) => Math.abs(p.x - f.x) - Math.abs(q.x - f.x))[0];
      if (g && Math.abs(g.x - f.x) < 260){ cpu.held[g.x > f.x ? 'right' : 'left'] = true; this.cd = 14; return; }
    }

      if (R < L.proj + .12 && f.stamina > 55){ cpu.press.dash = true; this.cd = 16; return; }

      }

      [{ press:['punch'], n:7 }, { press:['kick'], n:7 }, { press:['kick'], n:14 }],
      [{ press:['punch'], n:6 }, { hold:[fwd], press:['punch'], n:12 }]

    if (f.c.key === 'oni' && R < L.combo + .1){ this.seq(this.motion('qcb', fwd, back, 'kick')); this.cd = L.react; return; } // agarrão de comando
    if (R < L.combo + .12){ this.seq([{ hold:[fwd], press:['kick'], n:4 }]); this.cd = L.react; return; }
    if (R < L.combo + .22){ this.seq([{ hold:['down'], press:['kick'], n:16 }]); this.cd = L.react; return; }

  }
};

/* A REALIDADE SE QUEBRA: a tela racha a partir do golpe final (como um monitor
   quebrado), treme com falhas de imagem e depois se desfaz em cacos que caem
   no escuro, revelando o fim da história. */
function crackWeb(cx, cy, n, rings){
  const R = mulberry32(Math.floor(cx*7 + cy*13)), rays = [];
  for (let i = 0; i < n; i++){ const a = i/n*Math.PI*2 + (R() - .5)*.3, pts = [[cx, cy]];
    for (const r of rings) pts.push([cx + Math.cos(a + (R() - .5)*.12)*r, cy + Math.sin(a + (R() - .5)*.12)*r]); rays.push(pts); }
  return rays;
}
function addScreenCrack(){
  (game.screenCracks = game.screenCracks || []).push({ rays:crackWeb(rand(200, W - 200), rand(150, H - 200), 9, [40, 90, 160, 260]), t:0 });
  SFX.glass(); SFX.crack(); game.shake = Math.max(game.shake, 12);

function drawCrackRays(rays, grow, lw){
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [c, w] of [['rgba(0,0,0,.75)', lw + 3], ['rgba(240,230,255,.95)', lw]]){
    ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath();
    for (const pts of rays){ const n = Math.min(pts.length - 1, grow); ctx.moveTo(...pts[0]); for (let i = 1; i <= n; i++) ctx.lineTo(...pts[i]); }
    // anéis ligando os raios
    for (let k = 1; k <= Math.min(grow, rays[0].length - 1); k++){ for (let i = 0; i < rays.length; i++){ const a = rays[i][k], b = rays[(i + 1) % rays.length][k]; if (k % 2 === 0 || i % 2 === 0){ ctx.moveTo(...a); ctx.lineTo(...b); } } }
    ctx.stroke();
  }
  ctx.restore();
}
function drawScreenCracks(){ for (const c of game.screenCracks || []){ c.t++; drawCrackRays(c.rays, Math.min(4, 1 + c.t/4), 2); } }
function startShatter(){
  const [snap, sx] = mkCanvas(canvas.width, canvas.height); sx.drawImage(canvas, 0, 0);
  const cx = W/2 + rand(-80, 80), cy = H/2 - 40, rings = [70, 150, 260, 420, 640, 900], rays = crackWeb(cx, cy, 14, rings);
  const shards = [];
  for (let k = 0; k < rings.length; k++) for (let i = 0; i < rays.length; i++){
    const a0 = rays[i][k], b0 = rays[(i + 1) % rays.length][k], a1 = rays[i][k + 1], b1 = rays[(i + 1) % rays.length][k + 1];
    const poly4 = k === 0 ? [[cx, cy], a1, b1] : [a0, a1, b1, b0], mx = poly4.reduce((s, p) => s + p[0], 0)/poly4.length, my = poly4.reduce((s, p) => s + p[1], 0)/poly4.length;
    if (mx < -60 || mx > W + 60 || my < -60 || my > H + 60) continue;
    shards.push({ pts:poly4, mx, my, vx:(mx - cx)*.008 + rand(-.8, .8), vy:rand(-3, -.5), vr:rand(-.04, .04), x:0, y:0, r:0, delay:Math.floor(rand(0, 70)) });

function updateShatter(){
  const S = game.shatter, t = ++S.t;
  if (t % 14 === 0 && t < 110){ SFX.crack(); game.shake = Math.max(game.shake, 8); }
  if (t === 110){ SFX.glass(); SFX.boom(); game.shake = 24; }
  if (t > 110) for (const s of S.shards){ if (t - 110 < s.delay) continue; s.vy += .28; s.x += s.vx; s.y += s.vy; s.r += s.vr; }

function drawShatter(){
  const S = game.shatter, t = S.t; let sx = 0, sy = 0; if (game.shake > .5){ sx = rand(-1, 1)*game.shake; sy = rand(-1, 1)*game.shake*.6; }
  if (t <= 110){

function updateCamera(){

  else if (game.state === 'finishhim' && game.fh){ tz = 1.12; tx = (game.fh.w.x + game.fh.l.x)/2; ty = GROUND - 200; }
  else if (game.state === 'ko' && game.slowmo > 0){ const l = game.f.find(f => f.hp <= 0) || game.f[0]; tz = 1.15; tx = l.x; ty = GROUND - 180; }
  else if (['intro','fight','ko','finishhim','fatality','clash','paused','matchover'].includes(game.state) && game.f.length === 2){
    // câmera de luta: aproxima quando os lutadores estão perto e segue o meio dos dois
    const [p, q] = game.f, d = Math.abs(p.x - q.x);
